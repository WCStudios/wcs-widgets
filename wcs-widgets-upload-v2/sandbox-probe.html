<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Notion embed sandbox probe</title>
<style>
:root{--bg:#fff;--line:#ececec;--text:#111;--muted:#8a8a8a;--accent:#e8622c;--soft:#f6f6f5;
 --ok:#0ca30c;--bad:#d03b3b;--wait:#eda100}
@media (prefers-color-scheme:dark){:root{--bg:#171717;--line:#2a2a2a;--text:#f4f4f4;--muted:#8f8f8f;--soft:#0d0d0d}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;background:var(--bg);
 color:var(--text);padding:20px 22px 26px}
.eyebrow{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-size:19px;font-weight:800;letter-spacing:-.5px;margin-top:5px}
.lede{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
table{width:100%;border-collapse:collapse;margin-top:16px}
th{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700;
 text-align:left;padding:0 8px 7px 0;border-bottom:1.5px solid var(--text)}
td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top}
td.n{font-weight:700}
td.d{color:var(--muted);font-size:11px;line-height:1.45}
.pill{display:inline-block;font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:800;
 padding:3px 9px;border-radius:20px;white-space:nowrap}
.p-ok{color:var(--ok);background:rgba(12,163,12,.12)}
.p-bad{color:var(--bad);background:rgba(208,59,59,.12)}
.p-wait{color:var(--wait);background:rgba(237,161,0,.14)}
.ctx{margin-top:18px;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:12px 14px;
 font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;line-height:1.7;color:var(--muted);
 word-break:break-all}
.ctx b{color:var(--text);font-weight:700}
.verdict{margin-top:16px;border-left:3px solid var(--accent);background:var(--soft);padding:11px 14px;
 border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.55}
.where{margin-top:14px;padding:13px 16px;border-radius:9px;font-size:14px;font-weight:800;line-height:1.4}
.where small{display:block;font-size:11.5px;font-weight:500;margin-top:4px;opacity:.85}
.w-yes{color:#fff;background:var(--ok)}
.w-no{color:#fff;background:var(--bad)}

/* Native scrollbars render light-mode white on a dark panel unless the page
   declares which way it leans. Declare it, then restyle the bar so it reads as
   part of the widget instead of the browser. Kept at the end of the sheet on
   purpose — an earlier version of this sat above the dark media query and was
   silently overridden. */
:root{color-scheme:light dark}
*{scrollbar-width:thin;scrollbar-color:#c9c9c7 transparent}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c9c9c7;border-radius:9px;
 border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#aeaeac;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
@media (prefers-color-scheme:dark){
  *{scrollbar-color:#3b3b3b transparent}
  ::-webkit-scrollbar-thumb{background:#3b3b3b;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#525252;background-clip:content-box}
}
</style></head><body>

<div class="eyebrow">WCStudios · diagnostic</div>
<h1>Notion embed sandbox probe</h1>
<p class="lede">Determines exactly which network paths survive inside a Notion embed. Whether the
invoice widgets can ever write back to Notion depends entirely on these five rows.</p>

<div id="where"></div>

<table>
  <thead><tr><th style="width:31%">Test</th><th style="width:17%">Result</th><th>Detail</th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<div class="ctx" id="ctx"></div>
<div class="verdict" id="verdict">Running…</div>

<script>
const TESTS = [
  { name: "fetch · same-origin",
    why: "Reading our own data file the normal way.",
    run: () => fetch("finance-data.js", {cache:"no-store"}).then(r => r.ok ? r.text().then(t => t.length + " bytes") : Promise.reject("HTTP " + r.status)) },

  { name: "fetch · cross-origin (CORS)",
    why: "A permissive third-party endpoint. If this passes, a worker webhook is reachable in principle.",
    run: () => fetch("https://api.github.com/zen").then(r => r.ok ? r.text().then(t => JSON.stringify(t.slice(0,40))) : Promise.reject("HTTP " + r.status)) },

  { name: "fetch · POST cross-origin",
    why: "Writes are POSTs, and POST triggers a CORS preflight that GET does not.",
    run: () => fetch("https://api.github.com/graphql", {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"})
                 .then(r => "reached — HTTP " + r.status) },

  { name: "XHR · cross-origin",
    why: "Older transport, occasionally allowed where fetch is not.",
    run: () => new Promise((res, rej) => {
      const x = new XMLHttpRequest();
      x.open("GET", "https://api.github.com/zen");
      x.onload = () => res("HTTP " + x.status);
      x.onerror = () => rej("blocked");
      x.timeout = 8000; x.ontimeout = () => rej("timed out");
      x.send();
    }) },

  { name: "dynamic script inject",
    why: "What the widgets do today. Included as the control.",
    run: () => new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "finance-data.js?probe=" + Date.now();
      s.onload = () => res(window.FINDATA ? "loaded, FINDATA present" : "loaded, no global");
      s.onerror = () => rej("blocked");
      setTimeout(() => rej("timed out"), 8000);
      document.head.appendChild(s);
    }) },
];

// Am I actually inside a Notion embed? Everything below is meaningless if not.
const framed = window.top !== window.self;
const w = document.getElementById("where");
w.className = "where " + (framed ? "w-yes" : "w-no");
w.innerHTML = framed
  ? 'Running inside an embed — these results are the real answer.'
  : 'This is a plain browser tab, NOT a Notion embed.'
    + '<small>These results do not answer the question. Embed this page in Notion '
    + 'with /embed and read it there.</small>';

const rows = document.getElementById("rows");
const results = [];

TESTS.forEach((t, i) => {
  const tr = document.createElement("tr");
  // textContent, not innerHTML — a test name containing markup would otherwise
  // be parsed as markup and silently destroy its own row.
  const c1 = document.createElement("td"); c1.className = "n"; c1.textContent = t.name;
  const c2 = document.createElement("td");
  c2.innerHTML = '<span class="pill p-wait" id="p' + i + '">running</span>';
  const c3 = document.createElement("td"); c3.className = "d";
  const why = document.createElement("span"); why.id = "d" + i; why.textContent = t.why;
  c3.appendChild(why);
  tr.append(c1, c2, c3);
  rows.appendChild(tr);

  const done = (ok, detail) => {
    const p = document.getElementById("p" + i);
    p.className = "pill " + (ok ? "p-ok" : "p-bad");
    p.textContent = ok ? "allowed" : "blocked";
    document.getElementById("d" + i).textContent = t.why + "  →  " + detail;
    results[i] = ok;
    if (results.filter(r => r !== undefined).length === TESTS.length) verdict();
  };

  let settled = false;
  const guard = (fn) => (v) => { if (!settled) { settled = true; fn(v); } };
  try {
    t.run().then(guard(v => done(true, String(v))), guard(e => done(false, String(e && e.message || e))));
  } catch (e) { guard(e2 => done(false, String(e2)))(e); }
  setTimeout(guard(() => done(false, "no answer in 10s")), 10000);
});

document.getElementById("ctx").innerHTML =
    "<b>origin</b> " + window.origin
  + "<br><b>in iframe</b> " + (window.top !== window.self)
  + "<br><b>referrer</b> " + (document.referrer || "(none)")
  + "<br><b>cookies enabled</b> " + navigator.cookieEnabled
  + "<br><b>storage</b> " + (() => { try { localStorage.setItem("_p","1"); localStorage.removeItem("_p"); return "writable"; } catch (e) { return "blocked — " + e.name; } })();

function verdict(){
  const [sameFetch, corsGet, corsPost, xhr, script] = results;
  let v;
  if (corsGet && corsPost) {
    v = "<b>Interactive widgets are possible.</b> Cross-origin POST survives, so a widget button can reach a "
      + "worker webhook. Status pills and a working Send button are buildable.";
  } else if (corsGet && !corsPost) {
    v = "<b>Reads only.</b> GET passes but POST does not — the CORS preflight is being refused. "
      + "Writes would need a workaround, not a straight call.";
  } else if (sameFetch && !corsGet) {
    v = "<b>Same-origin only.</b> The widget can fetch its own files but cannot reach any other host, "
      + "so it can never call the worker. Mutations must happen in Notion itself.";
  } else {
    v = "<b>Fully sealed.</b> No network path out of the embed. Baking data in at build time is the only option, "
      + "and the widgets stay read-only.";
  }
  document.getElementById("verdict").innerHTML = v;
}
</script>
</body></html>
