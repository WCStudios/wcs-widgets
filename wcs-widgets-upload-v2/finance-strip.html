<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>WCS Finance Strip</title>
<style>
:root{--bg:#fff;--line:#ececec;--text:#111;--muted:#8a8a8a;--accent:#e8622c;--soft:#f2f2f2;
 --up:#0ca30c;--down:#d03b3b;--warn:#fab219}
@media (prefers-color-scheme:dark){:root{--bg:#171717;--line:#2a2a2a;--text:#f4f4f4;--muted:#8a8a8a;--soft:#262626}}
*{margin:0;box-sizing:border-box}html,body{height:100%;width:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;color:var(--text)}
.strip{display:flex;height:100%;width:100%;overflow-x:auto}
.panel{flex:1 1 0;min-width:190px;padding:clamp(14px,1.6vw,22px);border-right:1px solid var(--line);
 display:flex;flex-direction:column;justify-content:center;position:relative}
.panel:last-child{border-right:none}
.panel.click{cursor:pointer}
.k{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.big{font-size:clamp(26px,3.2vw,44px);font-weight:800;letter-spacing:-1.5px;line-height:1;margin-top:10px}
.sub{font-size:11px;color:var(--muted);margin-top:6px}
.delta{font-size:12px;font-weight:700;margin-top:6px;display:flex;align-items:center;gap:5px}
.delta.up{color:var(--up)}.delta.down{color:var(--down)}.delta.flat{color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.row{display:flex;gap:20px;margin-top:14px}
.n{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.nl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.hint{position:absolute;top:12px;right:14px;font-size:9px;color:var(--muted)}
.empty{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45;max-width:24ch}
.pill{display:inline-block;font-size:9px;letter-spacing:.4px;text-transform:uppercase;
 padding:2px 7px;border-radius:10px;background:var(--soft);color:var(--muted);margin-top:9px}

/* Mobile: the four-across strip becomes a 2x2 stack. */
@media (max-width:640px){
 .strip{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  height:100%;width:100%;overflow:hidden}
 .panel{min-width:0;padding:12px 13px;justify-content:center;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
 .panel:nth-child(2n){border-right:none}
 .panel:nth-child(n+3){border-bottom:none}
 .k{font-size:8.5px;letter-spacing:.5px}
 .big{font-size:23px;letter-spacing:-1px;margin-top:5px}
 .sub{font-size:9.5px;margin-top:3px}
 .delta{font-size:10px;margin-top:4px;gap:4px}
 .dot{width:6px;height:6px}
 .row{gap:12px;margin-top:8px}
 .n{font-size:12px}
 .nl{font-size:7.5px;margin-top:1px}
 .hint{top:8px;right:9px;font-size:8px}
 .empty{font-size:9.5px;margin-top:5px;max-width:20ch}
 .pill{font-size:8px;padding:2px 6px;margin-top:6px}
}

/* Native scrollbars render light-mode white on a dark panel unless the page
   declares which way it leans. Declare it, then restyle the bar so it reads as
   part of the widget instead of the browser. Kept at the end of the sheet on
   purpose — an earlier version of this sat above the dark media query and was
   silently overridden. */
:root{color-scheme:light dark}
*{scrollbar-width:thin;scrollbar-color:#c9c9c7 transparent}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c9c9c7;border-radius:9px;
 border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#aeaeac;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
@media (prefers-color-scheme:dark){
  *{scrollbar-color:#3b3b3b transparent}
  ::-webkit-scrollbar-thumb{background:#3b3b3b;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#525252;background-clip:content-box}
}

<script>
const JSSRC = "https://wcstudios.github.io/wcs-widgets/finance-data.js";
const usd = n => n == null ? "—" : "$" + Number(n).toLocaleString("en-US",{maximumFractionDigits:0});
const usdk = n => n == null ? "—" : (Math.abs(n) >= 1000
  ? "$" + (n/1000).toFixed(Math.abs(n) < 100000 ? 1 : 0).replace(/\.0$/,"") + "k"
  : "$" + Math.round(n));
let D = null, ai = 0;

function render(){
  if(!D) return;
  const s = D.summary;

  /* ---- 1 · Cash ---- */
  const accts = D.accounts || [];
  const known = accts.filter(a => a.balance != null);
  if(s.cashOnHand == null){
    cashBig.textContent = "Not connected";
    cashBig.style.fontSize = "clamp(17px,1.9vw,24px)";
    cashBig.style.letterSpacing = "-0.5px";
    cashSub.textContent = accts.length + " accounts staged, no balances yet";
    cashDetail.innerHTML = '<span class="pill">Awaiting connection</span>';
    cashHint.textContent = "";
    pCash.classList.remove("click");
  } else {
    const a = known[ai % known.length];
    cashBig.textContent = usd(s.cashOnHand);
    cashSub.textContent = "across " + known.length + " accounts";
    let html = '<div class="row"><div><div class="n">' + usd(s.cardBalance) + '</div><div class="nl">Card balance</div></div>';
    if(s.cardUtilization != null){
      const c = s.cardUtilization > 70 ? "var(--down)" : s.cardUtilization > 30 ? "var(--warn)" : "var(--up)";
      html += '<div><div class="n" style="color:' + c + '">' + s.cardUtilization + '%</div><div class="nl">Utilization</div></div>';
    }
    html += '</div>';
    cashDetail.innerHTML = html;
    cashHint.textContent = known.length > 1 ? "click" : "";
  }

  /* ---- 2 · Outstanding AR ---- */
  arBig.textContent = usd(s.arTotal);
  if(s.arOverdue > 0){
    arDelta.className = "delta down";
    arDelta.innerHTML = '<span class="dot" style="background:var(--down)"></span>' + usd(s.arOverdue) + ' overdue';
  } else {
    arDelta.className = "delta flat";
    arDelta.textContent = "None overdue";
  }
  arClients.textContent = (D.arByClient || []).length;
  const oldest = Math.max(0, ...(D.ar || []).map(i => i.daysOverdue || 0));
  arOldest.textContent = oldest ? oldest + "d" : "—";

  /* ---- 3 · Monthly burn ---- */
  burnBig.textContent = usd(s.monthlyBurn);
  burnYear.textContent = usdk(s.monthlyBurn * 12);
  burnItems.textContent = (D.burn.categories || []).reduce((a,c) => a + c.items.length, 0);

  /* ---- 4 · Net ---- */
  netBig.textContent = (s.monthlyNet >= 0 ? "+" : "−") + usd(Math.abs(s.monthlyNet));
  netBig.style.color = s.monthlyNet >= 0 ? "var(--up)" : "var(--down)";
  netSub.textContent = usd(s.mrr) + " in · " + usd(s.monthlyBurn) + " out";
  netClients.textContent = (D.retainers || []).length;
  const cov = s.monthlyBurn ? Math.round(s.mrr / s.monthlyBurn * 100) : null;
  netCover.textContent = cov == null ? "—" : cov + "%";
  netCover.style.color = cov != null && cov >= 100 ? "var(--up)" : "var(--warn)";
}

function cycle(){ const known=(D.accounts||[]).filter(a=>a.balance!=null); if(known.length>1){ai=(ai+1)%known.length;render();} }
document.getElementById("pCash").addEventListener("click", cycle);

function load(){
  // Try the published feed first, fall back to a sibling finance-data.js
  // (lets the same file preview locally before it's pushed to Pages).
  const tryLoad = (srcs, i) => {
    if(i >= srcs.length){ if(!rendered){ document.getElementById("cashSub").textContent = "data feed offline"; } return; }
    const sc = document.createElement("script");
    sc.src = srcs[i] + "?t=" + Date.now();
    sc.onload = () => { sc.remove();
      if(!window.FINDATA){ tryLoad(srcs, i+1); return; }
      /* finance-data.js is the build-time snapshot. Assigning it wipes whatever
         the live feed and the local event log had already put on screen — which
         is why Outstanding kept snapping back to the baked figure on every
         refresh and again every five minutes when this reloads. Re-apply both
         immediately instead of waiting for the next poll. */
      D = window.FINDATA;
      render();
      applyRows(null);        // local events first: instant, no network
      applyLive();            // then reconcile against the published feed
    };
    sc.onerror = () => { sc.remove(); tryLoad(srcs, i+1); };
    document.head.appendChild(sc);
  };
  tryLoad([JSSRC, "finance-data.js"], 0);
}
// Baked-in data first, so there is never an empty widget.
let rendered = false;
if(window.FINDATA){ D = window.FINDATA; render(); rendered = true; }
load(); setInterval(load, 300000); window.addEventListener("resize", render);

/* ── Live receivables ─────────────────────────────────────────────────────
   finance-data.js is a build-time snapshot, so until now the Outstanding
   figure only moved when someone rebuilt it — an invoice created in the
   builder never showed up here. The worker republishes ar-live.json after
   every action; merge that slice over the baked numbers the same way the
   tracker does. Everything else in the strip stays on the snapshot.

   Both hosts are asked because they fail in opposite ways: Pages purges on
   commit but needs a build, raw has a five-minute edge cache. Whichever
   answers with the newer `updated` wins. */
const AR_SRCS = [
  "ar-live.json",
  "https://raw.githubusercontent.com/wcstudios/wcs-widgets/main/wcs-widgets-upload-v2/ar-live.json"
];

async function applyLive(){
  const bust = "?t=" + Date.now();
  const got = (await Promise.all(AR_SRCS.map(u =>
    fetch(u + bust, {cache: "no-store"}).then(r => r.ok ? r.json() : null).catch(() => null)
  ))).filter(Boolean);
  if(!got.length) return;

  const live = got.sort((a, b) =>
    String(b.updated || "").localeCompare(String(a.updated || "")))[0];
  if(!live.summary) return;

  lastFeedAt = live.updated || lastFeedAt;
  applyRows(live);
}

/* ── Instant, without waiting on the worker ───────────────────────────────
   The published feed only moves when the worker rewrites it, which means the
   strip lags every invoice by however long that takes — and shows nothing at
   all if the worker's republish is failing. The builder and tracker already
   record what they did in localStorage, and all three widgets share an origin,
   so the strip can apply the same events and recompute its own totals.

   The feed's `updated` stamp is the watermark: an event is only replayed while
   the feed is still behind it, and a deletion is only filtered while the feed
   has not yet caught up. Once the feed passes that point it wins again. */
const EVENT_LOG = "wcsInvoiceLog.v1";
const TOMBS     = "wcsInvoiceTombs.v1";
let lastFeedAt = null;
const readLS = k => { try { return JSON.parse(localStorage.getItem(k) || "[]").filter(Boolean); }
                      catch(e){ return []; } };

function applyRows(live){
  if(!D) return;                       // finance-data.js has not landed yet
  const mark = Date.parse((live && live.updated) || lastFeedAt || "") || 0;
  let rows = ((live && live.ar) || D.ar || []).slice();

  /* Deletions and edits have to be applied in the order they happened. Folding
     the tombstones into the same timeline as the events is what makes
     create-then-delete and delete-then-recreate both come out right; filtering
     deletions first let a stale create event resurrect the row. */
  const timeline = readLS(EVENT_LOG)
    .concat(readLS(TOMBS).map(t => ({
      kind: "deleted", at: t.at, invoice: {notionPageId: t.id, name: t.name}
    })))
    .filter(e => e && e.at > mark)
    .sort((a, b) => a.at - b.at);

  for(const ev of timeline){
    const inv = ev.invoice; if(!inv) continue;
    /* Same rule as the tracker: the id is the key once a row has one. Matching
       on name let a delete of one row remove its namesake too. */
    const sameId = r => !!(inv.notionPageId && r.notionPageId
                           && r.notionPageId === inv.notionPageId);
    const hit = r => sameId(r) || (!r.notionPageId && !!(r.name && inv.name && r.name === inv.name));
    if(ev.kind === "deleted"){
      const doomed = inv.notionPageId ? sameId : (r => r.name === inv.name);
      rows = rows.filter(r => !doomed(r));
      continue;
    }
    const at = rows.findIndex(hit);
    const row = {notionPageId: inv.notionPageId || null, name: inv.name,
                 client: inv.client, amount: inv.amount || 0,
                 status: inv.status || "Draft", dueDate: inv.dueDate || null,
                 daysOverdue: 0, bucket: "Not yet due"};
    if(at >= 0) rows[at] = {...rows[at], ...row}; else rows.unshift(row);
  }

  const round = n => Math.round(n * 100) / 100;
  const sum = xs => round(xs.reduce((t, n) => t + n, 0));
  // Drafts count toward Outstanding; a draft was never sent, so it is never late.
  D.ar = rows;
  D.summary = Object.assign({}, D.summary, {
    arTotal:   sum(rows.map(r => r.amount || 0)),
    arOverdue: sum(rows.filter(r => (r.daysOverdue || 0) > 0 && r.status !== "Draft")
                       .map(r => r.amount || 0)),
    arCount:   rows.length
  });
  const by = key => {
    const m = new Map();
    for(const r of rows) m.set(key(r), (m.get(key(r)) || 0) + (r.amount || 0));
    return [...m.entries()].map(([k, v]) => [k, round(v)]).sort((a, b) => b[1] - a[1]);
  };
  D.arByClient = by(r => r.client).map(([client, amount]) => ({client, amount}));
  D.arAging    = by(r => r.bucket || "Not yet due").map(([bucket, amount]) => ({bucket, amount}));
  render();
}

applyLive();
setTimeout(() => applyRows(null), 600);   // anything recorded while we were away
setInterval(applyLive, 30000);
window.addEventListener("storage", e => {
  if(e.key === EVENT_LOG || e.key === TOMBS) applyRows(null);
});
document.addEventListener("visibilitychange", () => { if(!document.hidden) applyLive(); });

/* The builder and the tracker sit on this origin too, so a write there can say
   so directly instead of everyone waiting out a poll. */
try {
  const bc = new BroadcastChannel("wcs-invoices");
  // Any invoice event at all means the total moved — re-read rather than trying
  // to apply the delta here, so the strip can never drift from the feed.
  bc.onmessage = () => {
    applyRows(null);                                   // instant, from the log
    [2000, 8000, 20000].forEach(ms => setTimeout(applyLive, ms));   // reconcile
  };
} catch(e){ /* older browsers just poll */ }
</script></body></html>
