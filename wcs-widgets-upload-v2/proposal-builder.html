<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>Proposal Builder · WCStudios</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="builder.css?v=3">
<link rel="stylesheet" href="doclooks.css?v=7">
<link rel="stylesheet" href="docsign.css?v=1">
</head><body>
<div class="bar">
  <div class="barl">
    <div class="brand">DOCS<b>OS</b></div>
    <span class="sep"></span>
    <div class="ttl">Proposal builder<small id="barsub">WCStudios</small></div>
    <span class="sep"></span>
    <button id="bReset">New proposal</button>
    <button id="bPrint">Save PDF</button>
    <span class="sep"></span>
    <button class="primary" id="bGo">Create proposal</button>
    <span class="chip" id="chip"></span>
  </div>
  <button id="bConn" title="Worker connection">&#9881;<span class="cdot off" id="connDot"></span></button>
</div>
<div class="connpop" id="connPop" hidden>
  <div class="connh">Worker connection</div>
  <div class="grp closed" data-g="conn">
      <div class="lbl" data-toggle>Worker connection <span class="sum" id="sumConn"></span><span class="chev">›</span></div>
      <div class="gb">
        <div class="f"><label>widgetAction webhook URL</label><input id="cU"></div>
        <div class="f"><label>Widget key</label><input id="cK"></div>
        <button id="cSave">Save connection</button>
      </div>
    </div>
</div>
<div class="split">
  <div class="form">
    <div class="pick"><label>Client</label><select id="cPick"><option value="">New client</option></select></div>

    <div class="grp" data-g="who">
      <div class="lbl" data-toggle>Prepared for <span class="sum" id="sumWho"></span><span class="chev">›</span></div>
      <div class="gb">
        <div class="f"><label>Company</label><input id="company" placeholder="Gateway Fiber"></div>
        <div class="f"><label>Client contact</label><input id="contact" placeholder="David Workman"></div>
        <div class="f"><label>Project</label><input id="project" placeholder="Apartment Project"></div>
        <div class="r2"><div class="f"><label>Proposal date</label><input type="date" id="date"></div>
          <div class="f"><label>Delivery deadline</label><input type="date" id="delivery"></div></div>
        <div class="f"><label>Title in Notion <span class="hint">(auto)</span></label><input id="title"></div>
      </div>
    </div>

    <div class="grp" data-g="overview">
      <div class="lbl" data-toggle>Overview <span class="sum" id="sumOv"></span><span class="chev">›</span></div>
      <div class="gb"><div class="f"><label>What the piece is and why <span class="hint">(**bold** works)</span></label><textarea id="overview" rows="4"></textarea></div></div>
    </div>

    <div class="grp" data-g="scope">
      <div class="lbl" data-toggle>Scope of work <span class="sum" id="sumScope"></span><span class="chev">›</span></div>
      <div class="gb">
        <div class="f"><label>Production <span class="hint">(one per line)</span></label><textarea id="scope" rows="3"></textarea></div>
        <div class="f"><label>Deliverables <span class="hint">(one per line)</span></label><textarea id="deliv" rows="3"></textarea></div>
      </div>
    </div>

    <div class="grp" data-g="plan">
      <div class="lbl" data-toggle>Production plan <span class="sum"></span><span class="chev">›</span></div>
      <div class="gb">
        <div class="f"><label>Pre-production</label><input id="pre"></div>
        <div class="f"><label>Production</label><input id="prod"></div>
        <div class="f"><label>Post-production</label><input id="post"></div>
      </div>
    </div>

    <div class="grp" data-g="items">
      <div class="lbl" data-toggle>Proposal breakdown <span class="sum" id="sumItems"></span><span class="chev">›</span></div>
      <div class="gb">
        <div class="pz" id="presets"></div>
        <div id="items"></div>
        <button class="add" id="bAdd">+ Add line</button>
      </div>
    </div>

    <div class="grp closed" data-g="terms">
      <div class="lbl" data-toggle>Payment terms <span class="sum" id="sumTerms"></span><span class="chev">›</span></div>
      <div class="gb">
        <div class="f"><label>Deposit due on agreement</label><select id="deposit"><option value="50">50% deposit, 50% on first draft</option><option value="100">100% due on agreement</option><option value="0">Net 10 on delivery</option></select></div>
        <div class="f"><label><input type="checkbox" id="license" checked>Include the footage usage license</label></div>
      </div>
    </div>

    <div class="r2" id="edits" style="display:none;align-items:center;margin:10px 0"><span class="note" id="editsN"></span><button id="revert" style="flex:0 0 auto">Undo page edits</button></div>
    <p class="note" id="status"></p>
  </div>
  <div class="paper" id="paperWrap" style="flex-direction:column;align-items:center;justify-content:flex-start">
    <div class="scaler" id="scaler"><div class="doc" id="doc"></div></div></div>
</div>
<script src="hub.js?v=2"></script>
<script>
(() => {
const H = window.WCSHub, $ = id => document.getElementById(id), esc = H.esc;
const STORE = "wcsProposalBuilder.v1";
const SECTIONS = ["Production", "Post Production", "Add-ons"];
const PRESETS = [
  { l: "Half day shoot", sec: "Production", desc: "Production day (half day)", flat: 1200 },
  { l: "Full day shoot", sec: "Production", desc: "Production day (full day)", flat: 1500 },
  { l: "Crew on site", sec: "Production", desc: "One production artist on site" },
  { l: "Gear + travel", sec: "Production", desc: "Equipment setup/tear down, transportation, gear prep" },
  { l: "Main edit", sec: "Post Production", desc: "Produce one main video", hours: 8, rate: 120 },
  { l: "Social cut", sec: "Post Production", desc: "Short-form social version", hours: 3, rate: 120 },
  { l: "Finishing", sec: "Post Production", desc: "Included edit, music licensing, coloring, sound design & mastering" },
  { l: "1 revision", sec: "Post Production", desc: "One round of revisions included" },
  { l: "Drone", sec: "Add-ons", desc: "Drone coverage", flat: 350 },
];
const DEF = { pre: "brief kickoff, shot list, schedule, location coordination", prod: "crew, interview coverage, supporting visuals", post: "assembly, color, audio cleanup, music licensing, graphics" };
let F = null, items = [], titleTyped = false, saveT, pe = {};
/* Fixed wording (section headings, payment terms, the license, acceptance) is
   editable on the page too. pe holds what you changed, by key; "" hides a line. */
const fx = (key, runs) => pe[key] == null ? runs : H.parseRT(pe[key]);
const fxOn = key => pe[key] !== "";
const chip = (t, c = "") => { $("chip").textContent = t; $("chip").className = "chip on " + c; };
const lineAmt = it => (Number(it.flat) || 0) + (Number(it.hours) || 0) * (Number(it.rate) || 0);
const secTotal = s => items.filter(i => i.sec === s).reduce((a, i) => a + lineAmt(i), 0);
const total = () => items.reduce((a, i) => a + lineAmt(i), 0);
const usd = n => "$" + Number(n || 0).toLocaleString("en-US");

function drawItems(){
  $("items").innerHTML = items.map((it, k) => `<div class="item" data-k="${k}"><button class="x" data-x="${k}" title="Remove">×</button>
    <div class="f" style="padding-right:22px"><label>Section</label><select data-f="sec">${SECTIONS.map(s => `<option ${s === it.sec ? "selected" : ""}>${s}</option>`).join("")}</select></div>
    <div class="f"><label>Description</label><input data-f="desc" value="${esc(it.desc || "")}"></div>
    <div class="r3"><div class="f"><label>Hours</label><input data-f="hours" type="number" value="${esc(it.hours ?? "")}"></div>
      <div class="f"><label>Rate $</label><input data-f="rate" type="number" value="${esc(it.rate ?? "")}"></div>
      <div class="f"><label>Flat $</label><input data-f="flat" type="number" value="${esc(it.flat ?? "")}"></div></div>
    <div class="amt">${lineAmt(it) ? `<b>${usd(lineAmt(it))}</b>` : "included"}</div></div>`).join("");
  $("items").querySelectorAll(".item").forEach(el => {
    const it = items[+el.dataset.k];
    el.querySelectorAll("[data-f]").forEach(inp => inp.oninput = inp.onchange = () => { it[inp.dataset.f] = inp.value; el.querySelector(".amt").innerHTML = lineAmt(it) ? `<b>${usd(lineAmt(it))}</b>` : "included"; render(); });
  });
  $("items").querySelectorAll("[data-x]").forEach(b => b.onclick = () => { items.splice(+b.dataset.x, 1); drawItems(); render(); });
}

function nodes(){
  const N = [], R = H.parseRT, ht = (key, t) => pe[key] || t;
  const orange = (key, ic, t) => ({ t: "heading_3", r: [{ x: ic + " ", k: "orange" }, { x: ht(key, t), b: 1, k: "orange" }], ed: "fx:" + key });
  const plainH = (key, ic, t) => ({ t: "heading_3", r: [{ x: ic + " ", k: "default" }, { x: ht(key, t), b: 1, k: "orange" }], ed: "fx:" + key });
  const line = (key, runs, ch) => { if (!fxOn(key)) return; N.push({ t: "bulleted_list_item", r: fx(key, runs), ed: "fx:" + key, ...(ch ? { ch } : {}) }); };
  N.push({ t: "heading_3", r: [{ x: ht("h.overview", "Overview"), b: 1, k: "orange" }], ed: "fx:h.overview" });
  (H.paras($("overview").value).length ? H.paras($("overview").value) : ["Click to write the overview."]).forEach((p, k) => N.push(H.P(p, { ed: "overview:" + k })));
  N.push({ t: "divider" });
  N.push(orange("h.scope", "\u{1F4CD}", "Scope of Work"));
  H.lines($("scope").value).forEach((l, k) => N.push({ t: "bulleted_list_item", r: R(l), ed: "scope:" + k, mv: "scope:" + k }));
  const dl = H.lines($("deliv").value);
  if (dl.length) N.push({ t: "bulleted_list_item", r: [{ x: "Deliverables", b: 1 }], ch: dl.map((l, k) => ({ t: "bulleted_list_item", r: R(l), ed: "deliv:" + k, mv: "deliv:" + k })) });
  N.push({ t: "divider" });
  N.push(orange("h.plan", "\u{1F3AC}", "Production Plan"));
  [["Pre-production", "pre"], ["Production", "prod"], ["Post-production", "post"]].forEach(([k, id]) => { if ($(id).value.trim()) N.push({ t: "bulleted_list_item", r: [{ x: k + ": ", b: 1 }, ...R($(id).value)], ed: id }); });
  if ($("delivery").value) N.push({ t: "bulleted_list_item", r: [{ x: "Final delivery deadline: " }, { x: "by " + H.fmtLong($("delivery").value), b: 1 }] });
  N.push({ t: "divider" });
  N.push(plainH("h.items", "\u{1F4B0}", "Proposal Breakdown"));
  const rows = [[[{ x: "Item" }], [{ x: "Hours", b: 1 }], [{ x: "Rate", b: 1 }], [{ x: "Total", b: 1 }]]], edc = [null], mvr = [null], cls = [""];
  for (const sec of SECTIONS) {
    const its = items.map((it, k) => [it, k]).filter(([i]) => i.sec === sec); if (!its.length) continue;
    rows.push([[{ x: sec, b: 1 }], [], [], [{ x: usd(secTotal(sec)), b: 1 }]]); edc.push(null); mvr.push(null); cls.push("grp");
    its.forEach(([i, k]) => {
      rows.push([R(i.desc || "New line"), i.hours ? [{ x: String(i.hours) }] : [], i.rate ? [{ x: usd(i.rate) + "/hr" }] : [], i.flat ? [{ x: usd(i.flat) }] : []]);
      edc.push([`item:${k}:desc`, `item:${k}:hours`, `item:${k}:rate`, `item:${k}:flat`]); mvr.push(`item:${k}`); cls.push("");
    });
  }
  rows.push([[], [], [], []]); edc.push(null); mvr.push(null); cls.push("");
  rows.push([[{ x: "Total", b: 1 }], [], [], [{ x: usd(total()), b: 1 }]]); edc.push(null); mvr.push(null); cls.push("tot");
  N.push({ t: "table", hdr: 1, num: 1, rows, edc, mvr, cls });
  N.push({ t: "divider" });
  N.push(plainH("h.terms", "\u{1F4DD}", "Payment Terms"));
  const dep = $("deposit").value;
  if (dep === "50") line("t.dep50", [{ x: "50% deposit due upon project agreement", b: 1 }, { x: " to secure the shoot date and begin pre-production. " }, { x: "50% balance due upon delivery of first draft(s).", b: 1 }]);
  else if (dep === "100") line("t.dep100", [{ x: "Full payment due upon project agreement", b: 1 }, { x: " to secure the shoot date and begin pre-production." }]);
  else line("t.dep0", [{ x: "Invoice sent on delivery, due within 10 days (Net 10).", b: 1 }]);
  line("t.final", [{ x: "Final deliverables will be provided once the remaining balance is received." }]);
  line("t.pay", [{ x: "Payments can be made via check, ACH, or credit card (processing fees may apply)." }]);
  const sub = (key, runs) => fxOn(key) ? [{ t: "bulleted_list_item", r: fx(key, runs), ed: "fx:" + key }] : [];
  if ($("license").checked) line("t.lic", [{ x: "Footage Usage License", b: 1 }], [
    ...sub("t.lic1", [{ x: "WCStudios retains full ownership and copyright of all raw footage captured during production." }]),
    ...sub("t.lic2", [{ x: "The client is granted a " }, { x: "non-exclusive, perpetual license", b: 1 }, { x: " to use the final delivered videos for marketing, web, and internal purposes." }]),
    ...sub("t.lic3", [{ x: "Raw footage files are not included in the base project cost. If the client wishes to obtain the raw files, they may be purchased separately under a " }, { x: "footage buyout agreement", b: 1 }, { x: ", with pricing determined by project scope and file volume." }]),
    ...sub("t.lic4", [{ x: "WCStudios reserves the right to use completed projects and footage excerpts for portfolio, marketing, and promotional purposes unless otherwise agreed in writing." }]) ]);
  N.push({ t: "divider" });
  N.push(plainH("h.accept", "\u{1F91D}\u{1F3FC}", "Client Acceptance"));
  if (fxOn("t.accept")) N.push({ t: "to_do", r: fx("t.accept", [{ x: "I accept the terms of this proposal." }]), ed: "fx:t.accept" });
  return N;
}
function autoTitle(){ const c = $("company").value.trim(), p = $("project").value.trim(); return "Project Proposal - " + (c || "Client") + (p ? ` (${p})` : ""); }
function render(){
  if (!titleTyped) $("title").value = autoTitle();
  $("sumWho").textContent = $("company").value;
  $("sumOv").textContent = $("overview").value.slice(0, 40);
  $("sumScope").textContent = H.lines($("deliv").value).length ? H.lines($("deliv").value).length + " deliverables" : "";
  $("sumItems").textContent = total() ? usd(total()) : "";
  $("sumTerms").textContent = $("deposit").selectedOptions[0].text.split(",")[0];
  $("barsub").textContent = total() ? `${$("company").value || "New proposal"} · ${usd(total())}` : "WCStudios";
  const props = [["Company", $("company").value || "Company", "company"], ["Client", $("contact").value || "Client contact", "contact"], ["Date", H.fmtLong($("date").value)]].filter(p => p[1]);
  $("doc").innerHTML = `<div class="cover"><div class="wm"><b>WCS</b>TUDIOS</div><div class="tag">A video &amp; post production company</div></div>
    <div class="pg"><h1 class="t" data-ed="title">${esc($("title").value)}</h1><div class="props">${props.map(([k, x, ed]) => `<span>${k}</span><b${ed ? ` data-ed="${ed}"` : ""}>${esc(x)}</b>`).join("")}</div>${H.docHTML(nodes())}</div>`;
  H.sortable($("doc"), (g, a, b) => {
    if (g === "scope" || g === "deliv") { const id = g === "scope" ? "scope" : "deliv"; const ls = H.lines($(id).value); H.moveIn(ls, a, b); $(id).value = ls.join("\n"); }
    if (g === "item") { const sec = items[b].sec; H.moveIn(items, a, b); items[b].sec = sec; drawItems(); }
    render();
  });
  const nEd = Object.keys(pe).length;
  $("edits").style.display = nEd ? "flex" : "none";
  $("editsN").textContent = `${nEd} line${nEd === 1 ? "" : "s"} of fixed wording changed`;
  H.fitPaper($("paperWrap"), $("scaler"), $("doc"));
  clearTimeout(saveT); saveT = setTimeout(save, 400);
}
const FIELDS = ["company","contact","project","date","delivery","title","overview","scope","deliv","pre","prod","post","deposit"];
function save(){ try { localStorage.setItem(STORE, JSON.stringify({ c: $("cPick").value, f: Object.fromEntries(FIELDS.map(k => [k, $(k).value])), lic: $("license").checked, items, titleTyped, pe })); } catch(e){} }
function restore(){
  let s; try { s = JSON.parse(localStorage.getItem(STORE) || "null"); } catch(e){}
  if (!s) return false;
  $("cPick").value = s.c || ""; for (const [k, v] of Object.entries(s.f || {})) if ($(k)) $(k).value = v;
  $("license").checked = s.lic !== false; items = s.items || []; titleTyped = !!s.titleTyped; pe = s.pe || {}; return true;
}
function defaults(){
  FIELDS.forEach(k => $(k).value = ""); $("deposit").value = "50"; $("license").checked = true;
  $("date").value = H.iso(H.today()); $("pre").value = DEF.pre; $("prod").value = DEF.prod; $("post").value = DEF.post;
  items = [{ ...PRESETS[0] }, { ...PRESETS[2] }, { ...PRESETS[3] }, { ...PRESETS[4] }, { ...PRESETS[6] }, { ...PRESETS[7] }].map(p => { const { l, ...x } = p; return x; });
  titleTyped = false; pe = {};
}
async function create(){
  const c = H.conn();
  if (!c.url || !c.key) { document.querySelector('[data-g="conn"]').classList.remove("closed"); chip("Connect the worker", "err"); return; }
  const want = $("title").value;
  const payload = { title: want, company: $("company").value, client: $("contact").value, date: $("date").value, nodes: nodes() };
  $("bGo").disabled = true; chip("Creating…");
  try { await H.post("createProposal", payload); } catch(e){ chip("Couldn't reach the worker", "err"); $("bGo").disabled = false; return; }
  $("status").textContent = "Sent. The proposal lands in WCS Project Proposals in about a minute.";
  H.watch(f => (f.proposals || []).find(p => p.name === want), hit => {
    chip("Proposal created", "saved"); $("bGo").disabled = false;
    $("status").innerHTML = `Ready: <a href="#" id="open">${esc(want)}</a>`; $("open").onclick = e => { e.preventDefault(); H.openUrl(hit.url); };
  }, () => { chip("Still waiting", "err"); $("bGo").disabled = false; $("status").textContent = "Not in the feed yet. Check the proposals table; if nothing arrived, the worker needs its latest deploy."; });
}
/* Click anything on the paper to edit it; changes flow back to the panel. */
function commitEd(el){
  const ed = el.dataset.ed, md = H.runsToMd(H.domRuns(el)).trim(), plain = H.plainOf(el).trim();
  const [k, a, f] = ed.split(":");
  const setLine = (id, i, v) => { const ls = H.lines($(id).value); if (v) ls[i] = v; else ls.splice(i, 1); $(id).value = ls.join("\n"); };
  if (k === "title") { $("title").value = plain; titleTyped = true; }
  else if (k === "company" || k === "contact") $(k).value = plain;
  else if (k === "overview") { const ps = H.paras($("overview").value); if (md && md !== "Click to write the overview.") ps[+a] = md; else ps.splice(+a, 1); $("overview").value = ps.join("\n\n"); }
  else if (k === "scope") setLine("scope", +a, md);
  else if (k === "deliv") setLine("deliv", +a, md);
  else if (["pre", "prod", "post"].includes(k)) $(k).value = plain.replace(/^(Pre-production|Production|Post-production):\s*/i, "");
  else if (k === "fx") {
    // Headings keep their icon; you edit the words. Clearing a line hides it; clearing a heading restores it.
    const v = /^h\./.test(a) ? el.textContent.replace(/^[\s\u200d\ufe0f\p{Extended_Pictographic}\p{Emoji_Modifier}]+/u, "").trim() : md;
    if (/^h\./.test(a) && !v) delete pe[a]; else pe[a] = v;
  }
  else if (k === "item") {
    const it = items[+a], num = plain.replace(/[^0-9.]/g, "");
    if (f === "desc") it.desc = md; else it[f] = num;
    drawItems();
  }
  render();
}
async function boot(){
  F = await H.loadFeed();
  if (F) $("cPick").innerHTML = `<option value="">New client</option>` + F.clients.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  if (!restore()) defaults();
  $("presets").innerHTML = PRESETS.map((p, k) => `<button data-p="${k}">${esc(p.l)}${p.flat ? `<b>${usd(p.flat)}</b>` : p.rate ? `<b>${p.hours}h</b>` : ""}</button>`).join("");
  $("presets").querySelectorAll("[data-p]").forEach(b => b.onclick = () => { const { l, ...x } = PRESETS[+b.dataset.p]; items.push({ ...x }); drawItems(); render(); });
  $("bAdd").onclick = () => { items.push({ sec: "Post Production", desc: "" }); drawItems(); render(); };
  drawItems();
  H.wireGroups();
  const cc = H.conn(); $("cU").value = cc.url || ""; $("cK").value = cc.key || ""; $("sumConn").textContent = cc.url ? "connected" : "not set";
  $("cSave").onclick = () => { H.setConn($("cU").value.trim(), $("cK").value.trim()); H.toast("Connection saved"); $("sumConn").textContent = "connected"; };
  $("cPick").onchange = () => { const c = F && F.clients.find(x => x.id === $("cPick").value); if (c) { $("company").value = c.name; $("contact").value = (c.contact || "").split(",")[0].trim(); } render(); };
  FIELDS.forEach(k => $(k).addEventListener("input", render)); $("license").onchange = render;
  $("title").addEventListener("input", () => { titleTyped = true; });
  $("bReset").onclick = () => { try { localStorage.removeItem(STORE); } catch(e){} $("cPick").value = ""; defaults(); drawItems(); render(); chip("Started fresh"); };
  $("bPrint").onclick = () => window.print();
  $("bGo").onclick = create;
  $("revert").onclick = () => { pe = {}; render(); chip("Page edits cleared"); };
  $("doc").addEventListener("click", e => {
    const t = e.target.closest("[data-ed]"); if (!t || t.isContentEditable) return;
    if (t.tagName === "A" || e.target.closest("a")) e.preventDefault();
    H.editIn(t, commitEd, { multiline: /^(overview|fx:t\.)/.test(t.dataset.ed), select: /^item:\d+:(hours|rate|flat)/.test(t.dataset.ed) });
  });
  addEventListener("resize", () => H.fitPaper($("paperWrap"), $("scaler"), $("doc")));
  render();
}
boot();
})();
</script>
<script>
/* Settings gear: the worker connection lives behind it, as in FinanceOS. The
   inputs keep their ids, so the code above that reads and saves them is
   unchanged. When Create finds no connection it opens the old section; that
   now opens this panel instead. */
(function(){
  const pop = document.getElementById("connPop"), btn = document.getElementById("bConn");
  const grp = pop.querySelector('[data-g="conn"]'), sum = document.getElementById("sumConn");
  const dot = document.getElementById("connDot");
  const show = on => { pop.hidden = !on; btn.classList.toggle("on", on); };
  btn.addEventListener("click", e => { e.stopPropagation(); show(pop.hidden); });
  /* pointerdown, not click: Create opens this panel from inside its own click,
     and a click listener here would see that same click and shut it again. */
  document.addEventListener("pointerdown", e => {
    if(!pop.hidden && !pop.contains(e.target) && !btn.contains(e.target)) show(false);
  });
  document.addEventListener("keydown", e => { if(e.key === "Escape" && !pop.hidden) show(false); });
