<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice Builder — WCStudios</title>
<style>
/* ══ App shell ══════════════════════════════════════════════ */
:root{--bg:#fff;--line:#ececec;--text:#111;--muted:#8a8a8a;--accent:#e8622c;--soft:#f6f6f5;
 --field:#fff;--fieldline:#dcdcdc;--plane:#f9f9f7;--up:#0ca30c;--down:#d03b3b}
@media (prefers-color-scheme:dark){:root{--bg:#171717;--line:#2a2a2a;--text:#f4f4f4;--soft:#212121;
 --field:#1e1e1e;--fieldline:#343434;--plane:#111}}
*{margin:0;box-sizing:border-box}
html,body{height:100%;width:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;color:var(--text);
 display:flex;flex-direction:column;overflow:hidden}

.bar{display:flex;align-items:center;gap:10px;padding:11px clamp(12px,1.4vw,18px);
 border-bottom:1px solid var(--line);flex:0 0 auto}
.bar .ttl{font-size:11px;font-weight:800;letter-spacing:.3px;flex:1}
.bar .ttl small{display:block;font-weight:400;color:var(--muted);font-size:10px;letter-spacing:0;margin-top:2px}
.bar{overflow-x:auto}
.chip{font-size:9px;letter-spacing:.4px;text-transform:uppercase;font-weight:700;padding:4px 9px;
 border-radius:11px;background:var(--soft);color:var(--muted);white-space:nowrap;opacity:0;transition:opacity .2s}
.chip.on{opacity:1}
.chip.saved{color:var(--up);background:rgba(12,163,12,.12)}
button{font:inherit;cursor:pointer;border:1px solid var(--fieldline);background:var(--field);color:var(--text);
 font-size:11px;font-weight:700;padding:7px 12px;border-radius:8px;white-space:nowrap;transition:.12s}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.07)}
button.ok{background:var(--up);border-color:var(--up);color:#fff}

.split{flex:1;display:flex;min-height:0}
.form{width:340px;flex:0 0 auto;overflow-y:auto;padding:16px clamp(12px,1.4vw,18px) 40px;
 border-right:1px solid var(--line)}
.paper{flex:1;min-width:0;overflow:auto;background:var(--plane);padding:20px;display:flex;justify-content:center}
@media(max-width:820px){.split{flex-direction:column}.form{width:100%;border-right:none;border-bottom:1px solid var(--line);max-height:46%}}

.pick{margin-bottom:16px}
.pick label{display:block;font-size:9px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);
 font-weight:700;margin-bottom:5px}
.grp{margin-bottom:14px}
.grp>.lbl{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
 font-size:9px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:700;
 padding-bottom:7px;border-bottom:1px solid var(--line);margin-bottom:10px}
.grp>.lbl:hover{color:var(--text)}
.grp>.lbl .sum{flex:1;min-width:0;text-align:right;text-transform:none;letter-spacing:0;
 font-size:10.5px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp>.lbl .chev{flex:0 0 auto;font-size:13px;line-height:1;transform:rotate(90deg);transition:transform .15s;opacity:.6}
.grp.closed>.lbl{margin-bottom:0}
.grp.closed>.lbl .chev{transform:rotate(0deg)}
.grp.closed>.gb{display:none}
.grp.flash>.lbl{color:var(--accent);border-bottom-color:var(--accent)}
.f{margin-bottom:9px}
.f label{display:block;font-size:9.5px;color:var(--muted);margin-bottom:3px;letter-spacing:.2px}
input,select,textarea{width:100%;font:inherit;font-size:12px;color:var(--text);background:var(--field);
 border:1px solid var(--fieldline);border-radius:7px;padding:7px 9px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:56px;line-height:1.5}
.r2{display:flex;gap:8px}.r2>*{flex:1;min-width:0}
.r3{display:flex;gap:8px}.r3>*{flex:1;min-width:0}

.item{background:var(--soft);border-radius:9px;padding:10px;margin-bottom:8px;position:relative}
.item .x{position:absolute;top:7px;right:7px;width:19px;height:19px;padding:0;border-radius:6px;
 font-size:12px;line-height:1;color:var(--muted);background:transparent;border:none}
.item .x:hover{color:var(--down);background:var(--field)}
.item .amt{font-size:10px;color:var(--muted);text-align:right;margin-top:5px;font-variant-numeric:tabular-nums}
.item .amt b{color:var(--text);font-size:11.5px}
.add{width:100%;border-style:dashed;color:var(--muted)}
.item .star{position:absolute;top:7px;right:30px;width:19px;height:19px;padding:0;border-radius:6px;
 font-size:11px;line-height:1;color:var(--muted);background:transparent;border:none}
.item .star:hover{color:var(--accent);background:var(--field)}
.item .star.on{color:var(--accent)}
.pz{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.pz button{position:relative;padding:5px 9px;font-size:10.5px;font-weight:600;border-radius:14px;
 background:var(--soft);border-color:transparent;color:var(--text)}
.pz button:hover{border-color:var(--accent)}
.pz button b{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;margin-left:4px}
.pz button.unset b{color:var(--accent)}
.pz .del{position:absolute;top:-4px;right:-4px;width:15px;height:15px;padding:0;border-radius:50%;
 font-size:9px;line-height:1;background:var(--down);border-color:var(--down);color:#fff;display:none}
.pz button:hover .del{display:block}
.pzhint{font-size:9.5px;color:var(--muted);margin-bottom:9px;line-height:1.45}

/* ══ The invoice paper ══════════════════════════════════════ */
.scaler{transform-origin:top center}
.inv{width:8.5in;min-height:11in;background:#fff;color:#111111;display:flex;flex-direction:column;
 box-shadow:0 2px 18px rgba(0,0,0,.14);--ink:#111111;--ink2:#4a4a4a;--gray:#8a8a8a;
 --acc:#e8622c;--hair:#e6e6e6;--wash:#f6f6f5;--blk:#0e0e0e;--good:#0ca30c;--bad:#d03b3b}
.inv *{box-sizing:border-box}
.inv .band{background:var(--blk);color:#fff;padding:.36in .62in .32in;display:flex;align-items:flex-end;
 justify-content:space-between;gap:24px}
.inv .band img{height:.26in;display:block}
.inv .tag{font-size:7.5pt;letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:9px}
.inv .word{font-size:20pt;font-weight:800;letter-spacing:-.7px;line-height:1;text-align:right}
.inv .hnum{font-size:8.5pt;color:rgba(255,255,255,.62);margin-top:7px;text-align:right;font-variant-numeric:tabular-nums}
.inv .rule{height:3px;background:var(--acc)}
.inv .body{padding:.38in .62in .18in;flex:1 0 auto}
.inv .k{font-size:7pt;letter-spacing:1.2px;text-transform:uppercase;color:var(--gray);font-weight:700}
.inv .meta{display:flex;gap:.5in;justify-content:space-between;align-items:flex-start}
.inv .blk{margin-top:8px;font-size:9.5pt;line-height:1.55;color:var(--ink2)}
.inv .blk .nm{font-size:11pt;font-weight:800;color:var(--ink);margin-bottom:2px}
.inv .facts{min-width:2.5in}
.inv .frow{display:flex;justify-content:space-between;gap:22px;font-size:9.5pt;padding:5px 0;
 border-bottom:1px solid var(--hair);font-variant-numeric:tabular-nums}
.inv .frow:last-of-type{border-bottom:none}
.inv .frow span:first-child{color:var(--gray)}
.inv .frow span:last-child{font-weight:700}
.inv .due{margin-top:11px;background:var(--wash);border-left:3px solid var(--acc);padding:11px 14px;border-radius:0 7px 7px 0}
.inv .due .k{color:var(--ink2)}
.inv .due .amt{font-size:20pt;font-weight:800;letter-spacing:-1px;margin-top:3px;font-variant-numeric:tabular-nums}
.inv table{width:100%;border-collapse:collapse;margin-top:.30in}
.inv thead th{font-size:7pt;letter-spacing:1.1px;text-transform:uppercase;color:var(--gray);font-weight:700;
 text-align:left;padding:0 10px 8px 0;border-bottom:1.5px solid var(--ink)}
.inv th.r,.inv td.r{text-align:right;padding-right:0}
.inv th.c,.inv td.c{text-align:center}
.inv tbody td{padding:9px 10px 9px 0;border-bottom:1px solid var(--hair);font-size:9.5pt;
 vertical-align:top;color:var(--ink2)}
.inv tbody td.desc{color:var(--ink);font-weight:600}
.inv tbody td.desc .sm{display:block;font-weight:400;color:var(--gray);font-size:8.5pt;margin-top:3px;line-height:1.45}
.inv tbody td.r,.inv tbody td.c{font-variant-numeric:tabular-nums}
.inv tbody td.money{font-weight:700;color:var(--ink)}
.inv .tot{display:flex;justify-content:flex-end;margin-top:16px}
.inv .totbox{width:3in}
.inv .trow{display:flex;justify-content:space-between;font-size:9.5pt;padding:6px 0;font-variant-numeric:tabular-nums}
.inv .trow span:first-child{color:var(--gray)}
.inv .trow.grand{border-top:1.5px solid var(--ink);margin-top:6px;padding-top:11px;font-size:13pt;
 font-weight:800;letter-spacing:-.4px}
.inv .trow.grand span:first-child{color:var(--ink)}
.inv .trow.paid span:last-child{color:var(--good)}
.inv .cols{display:flex;gap:.45in;margin-top:.30in}
.inv .col{flex:1}
.inv .pay{font-size:9pt;line-height:1.55;color:var(--ink2);margin-top:8px}
.inv .pay b{color:var(--ink)}
.inv .paylink{display:inline-block;margin-top:9px;background:var(--acc);color:#fff;text-decoration:none;
 font-size:9pt;font-weight:700;padding:9px 16px;border-radius:7px}
.inv .notes{font-size:9pt;line-height:1.65;color:var(--ink2);margin-top:8px;white-space:pre-line}
.inv .foot{margin-top:auto;flex:0 0 auto;padding:.20in .62in .24in;border-top:1px solid var(--hair);
 display:flex;justify-content:space-between;align-items:flex-end;gap:20px;font-size:8pt;color:var(--gray);line-height:1.6}
.inv .foot b{color:var(--ink)}
.inv .stamp{font-size:7.5pt;letter-spacing:1.4px;text-transform:uppercase;font-weight:800;
 padding:5px 11px;border-radius:20px;white-space:nowrap}
.inv .stamp.paid{color:var(--good);background:rgba(12,163,12,.1)}
.inv .stamp.overdue{color:var(--bad);background:rgba(208,59,59,.1)}
.inv .stamp.sent,.inv .stamp.draft{color:var(--acc);background:rgba(232,98,44,.1)}

/* ══ Print: the paper only, unscaled ════════════════════════ */
@page{size:Letter;margin:0}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  .bar,.form{display:none !important}
  .split{display:block}
  .paper{padding:0;background:#fff;display:block;overflow:visible}
  .scaler{transform:none !important;width:auto !important}
  .inv{box-shadow:none;width:8.5in;height:11in}
  .inv,.inv *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head><body>

<div class="bar">
  <div class="ttl">Invoice builder<small id="barsub">WCStudios</small></div>
  <span class="chip" id="chip"></span>
  <button id="bReset">Reset</button>
  <button id="bJson">Copy JSON</button>
  <button id="bNotion">Copy Notion row</button>
  <button id="bEmail">Copy email</button>
  <button class="primary" id="bPrint">Save as PDF</button>
</div>

<div class="split">
  <div class="form" id="form">

    <div class="pick">
      <label>Client</label>
      <select id="cPick"><option value="">— new client —</option></select>
    </div>

    <div class="grp" data-g="client">
      <div class="lbl" data-toggle>Bill to <span class="sum" id="sumClient"></span><span class="chev">›</span></div>
      <div class="gb">
        <div class="f"><label>Name</label><input id="cName" placeholder="Pulltab Sports"></div>
        <div class="f"><label>Contact / attention line <span style="opacity:.6">(autofills from Notion)</span></label><input id="cCompany" placeholder="Attn: Accounts Payable"></div>
        <div class="f"><label>Email</label><input id="cEmail" type="email" placeholder="billing@client.com"></div>
        <div class="f"><label>Address</label><input id="cAddress" placeholder="optional"></div>
        <div class="f"><label>City, State ZIP</label><input id="cCity" placeholder="optional"></div>
      </div>
    </div>

    <div class="grp" data-g="invoice">
      <div class="lbl" data-toggle>Invoice details <span class="sum" id="sumInvoice"></span><span class="chev">›</span></div>
      <div class="gb">
        <div class="r2">
          <div class="f"><label>Number</label><input id="iNum"></div>
          <div class="f"><label>Status</label><select id="iStatus">
            <option>Draft</option><option selected>Sent</option><option>Paid</option><option>Overdue</option></select></div>
        </div>
        <div class="r2">
          <div class="f"><label>Invoice date</label><input id="iDate" type="date"></div>
          <div class="f"><label>Terms</label><select id="iTerms">
            <option>Due on receipt</option><option>Net 7</option><option selected>Net 15</option>
            <option>Net 30</option><option>Net 45</option></select></div>
        </div>
        <div class="f"><label>Due date <span style="opacity:.6">(auto from terms — override if needed)</span></label>
          <input id="iDue" type="date"></div>
      </div>
    </div>

    <div class="grp" data-g="items">
      <div class="lbl" data-toggle>Line items <span class="sum" id="sumItems"></span><span class="chev">›</span></div>
      <div class="gb">
        <div class="pz" id="presets"></div>
        <div class="pzhint" id="pzhint"></div>
        <div id="items"></div>
        <button class="add" id="bAdd">+ Add line item</button>
      </div>
    </div>

    <div class="grp" data-g="adj">
      <div class="lbl" data-toggle>Adjustments <span class="sum" id="sumAdj"></span><span class="chev">›</span></div>
      <div class="gb">
        <div class="r3">
          <div class="f"><label>Discount $</label><input id="aDisc" type="number" step="0.01" placeholder="0"></div>
          <div class="f"><label>Travel $</label><input id="aShip" type="number" step="0.01" placeholder="0"></div>
          <div class="f"><label>Tax %</label><input id="aTax" type="number" step="0.001" placeholder="0"></div>
        </div>
        <div class="f"><label>Already paid $</label><input id="aPaid" type="number" step="0.01" placeholder="0"></div>
      </div>
    </div>

    <div class="grp" data-g="notes">
      <div class="lbl" data-toggle>Notes &amp; payment <span class="sum" id="sumNotes"></span><span class="chev">›</span></div>
      <div class="gb">
        <div class="f"><label>Notes to client</label><textarea id="nNotes"></textarea></div>
        <div class="f"><label>ACH line</label><input id="pAch" placeholder="Routing and account details sent separately on request."></div>
        <div class="f"><label>Checks payable to</label><input id="pCheck" value="WCStudios"></div>
        <div class="f"><label>Pay-online link</label><input id="pLink" placeholder="https://www.paypal.com/invoice/..."></div>
      </div>
    </div>

  </div>

  <div class="paper" id="paperWrap">
    <div class="scaler" id="scaler">
      <div class="inv" id="inv">
        <div class="band">
          <div><img id="logo" alt="WCStudios"><div class="tag">A Video &amp; Post Production Company</div></div>
          <div><div class="word">INVOICE</div><div class="hnum" id="pNum">No. —</div></div>
        </div>
        <div class="rule"></div>
        <div class="body">
          <div class="meta">
            <div>
              <div class="k">Bill to</div><div class="blk" id="pBill"></div>
              <div class="k" style="margin-top:20px">From</div><div class="blk" id="pFrom"></div>
            </div>
            <div class="facts">
              <div class="frow"><span>Invoice number</span><span id="fNum">—</span></div>
              <div class="frow"><span>Invoice date</span><span id="fDate">—</span></div>
              <div class="frow"><span>Due date</span><span id="fDue">—</span></div>
              <div class="frow"><span>Terms</span><span id="fTerms">—</span></div>
              <div class="due"><div class="k">Amount due (USD)</div><div class="amt" id="fAmt">$0.00</div></div>
            </div>
          </div>
          <table>
            <thead><tr><th style="width:52%">Description</th><th class="c" style="width:11%">Qty</th>
              <th class="r" style="width:18%">Rate</th><th class="r" style="width:19%">Amount</th></tr></thead>
            <tbody id="pItems"></tbody>
          </table>
          <div class="tot"><div class="totbox" id="pTotals"></div></div>
          <div class="cols">
            <div class="col"><div class="k">Payment</div><div class="pay" id="pPay"></div></div>
            <div class="col"><div class="k">Notes</div><div class="notes" id="pNotes"></div></div>
          </div>
        </div>
        <div class="foot"><div id="pFoot"></div><div id="pStamp"></div></div>
      </div>
    </div>
  </div>
</div>

              email:"bennett@wcstudios.co", web:"www.wcstudios.co"};

const $ = id => document.getElementById(id);
const usd = n => "$" + Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const dt  = s => s ? new Date(s+"T12:00:00").toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}) : "—";
const todayISO = () => new Date(new Date().getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);

let items = [], clients = [], dueTouched = false;

/* ── Local persistence ─────────────────────────────────────
   Autosaves the working draft and, per client, the last invoice you
   sent them — so picking a client brings back its line items. Wrapped
   in try/catch because some embed contexts partition storage; if it's
   unavailable the builder still works, it just forgets between visits. */
const STORE = "wcsInvoiceBuilder.v1";
let mem = {}, seed = null, saveTimer = null, storageOK = true;

function readStore(){
  try{ return JSON.parse(localStorage.getItem(STORE) || "{}"); }
  catch(e){ storageOK = false; return {}; }
}
function writeStore(o){
  try{ localStorage.setItem(STORE, JSON.stringify(o)); }
  catch(e){ storageOK = false; }
}
const FIELDS = ["cName","cCompany","cEmail","cAddress","cCity","iNum","iStatus","iDate","iTerms","iDue",
                "aDisc","aShip","aTax","aPaid","nNotes","pAch","pCheck","pLink"];

function snapshotForm(){
  const o = {items: items, dueTouched: dueTouched, open: openState};
  FIELDS.forEach(id => o[id] = $(id).value);
  return o;
}
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    writeStore({draft: snapshotForm(), mem: mem, seed: seed, presets: presets});
    flag("Draft saved", "saved");
  }, 600);
}
function flag(text, cls){
  const c = $("chip");
  c.textContent = text; c.className = "chip on " + (cls || "");
  clearTimeout(flag.t); flag.t = setTimeout(() => c.className = "chip", 2200);
}

/* Remember what we billed this client, so next time it comes back. */
function remember(){
  const n = $("cName").value.trim();
  if(!n) return;
  mem[n] = {items: JSON.parse(JSON.stringify(items)), terms: $("iTerms").value,
            notes: $("nNotes").value, company: $("cCompany").value,
            email: $("cEmail").value, link: $("pLink").value, lastNumber: $("iNum").value};
  writeStore({draft: snapshotForm(), mem: mem, seed: seed, presets: presets});
}

/* 0168 → 0169, keeping the zero padding. */
function bump(num){
  const m = /^(\D*)(\d+)(\D*)$/.exec(String(num || ""));
  if(!m) return num;
  const next = String(+m[2] + 1).padStart(m[2].length, "0");
  return m[1] + next + m[3];
}

/* ── Line-item rows ───────────────────────────────────────── */
function blank(){ return {description:"", detail:"", qty:1, unit:"", rate:0}; }

function drawItems(){
  $("items").innerHTML = items.map((it,i) => `
    <div class="item">
      <button class="star" data-star="${i}" title="Save this line as a preset">★</button>
      <button class="x" data-del="${i}" title="Remove">✕</button>
      <div class="f"><label>Description</label><input data-i="${i}" data-k="description" value="${esc(it.description)}"></div>
      <div class="f"><label>Detail (optional second line)</label><input data-i="${i}" data-k="detail" value="${esc(it.detail)}"></div>
      <div class="r3">
        <div class="f"><label>Qty</label><input data-i="${i}" data-k="qty" type="number" step="any" value="${it.qty}"></div>
        <div class="f"><label>Unit</label><input data-i="${i}" data-k="unit" value="${esc(it.unit)}" placeholder="mo"></div>
        <div class="f"><label>Rate</label><input data-i="${i}" data-k="rate" type="number" step="0.01" value="${it.rate}"></div>
      </div>
      <div class="amt">Line total <b>${usd((it.qty||0)*(it.rate||0))}</b></div>
    </div>`).join("");

  $("items").querySelectorAll("input").forEach(el => el.addEventListener("input", e => {
    const i = +e.target.dataset.i, k = e.target.dataset.k;
    items[i][k] = (k === "qty" || k === "rate") ? parseFloat(e.target.value || 0) : e.target.value;
    persist();
    if(k === "qty" || k === "rate")
      e.target.closest(".item").querySelector(".amt b").textContent = usd((items[i].qty||0)*(items[i].rate||0));
    paint();
  }));
  $("items").querySelectorAll("[data-star]").forEach(el => el.addEventListener("click", () => {
    savePreset(items[+el.dataset.star]);
  }));
  $("items").querySelectorAll("[data-del]").forEach(el => el.addEventListener("click", () => {
    items.splice(+el.dataset.del, 1); if(!items.length) items.push(blank()); drawItems(); paint(); persist();
  }));
}

/* ── Collapsible sections ──────────────────────────────────
   The sidebar reads in the same order as the invoice itself — bill to,
   invoice details, line items, adjustments, notes — and each section
   collapses to a one-line summary of what's on the page, so the form
   mirrors the document instead of burying it. Line items stay open;
   that's where the work happens. Client details spring open on their own
   whenever there's no name yet, which is what "new client" means. */
const GROUPS = ["client","invoice","items","adj","notes"];
let openState = {};

function grp(name){ return document.querySelector('.grp[data-g="' + name + '"]'); }

function setOpen(name, isOpen, flash){
  openState[name] = isOpen;
  const g = grp(name);
  if(!g) return;
  g.classList.toggle("closed", !isOpen);
  if(flash && isOpen){ g.classList.add("flash"); setTimeout(() => g.classList.remove("flash"), 1200); }
}

function summarise(){
  const I = spec(), T = totals(I), c = I.client;
  $("sumClient").textContent = c.name
    ? c.name + (c.company ? " \u00b7 " + c.company.replace(/^Attn:\s*/i, "") : "")
    : "no client yet";
  $("sumInvoice").textContent = [I.number || "no number", I.status,
    I.dueDate ? "due " + new Date(I.dueDate + "T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})
              : I.terms].join(" \u00b7 ");
  const n = I.items.length;
  $("sumItems").textContent = n ? n + (n === 1 ? " line \u00b7 " : " lines \u00b7 ") + usd(T.sub) : "empty";
  const bits = [];
  if(I.discount)   bits.push("\u2212" + usd(I.discount));
  if(I.shipping)   bits.push("travel " + usd(I.shipping));
  if(I.taxRate)    bits.push((I.taxRate*100).toFixed(3).replace(/0+$/,"").replace(/\.$/,"") + "% tax");
  if(I.amountPaid) bits.push("paid " + usd(I.amountPaid));
  $("sumAdj").textContent = bits.length ? bits.join(" \u00b7 ") : "none";
  $("sumNotes").textContent = (I.payment.link ? "pay link \u00b7 " : "")
    + (I.notes ? I.notes.split("\n")[0].slice(0,34) : "default note");
}

document.addEventListener("click", e => {
  const lbl = e.target.closest(".grp > .lbl");
  if(!lbl) return;
  const name = lbl.parentElement.dataset.g;
  setOpen(name, !openState[name]);
  persist();
});

/* ── Line-item presets ─────────────────────────────────────
   Click a chip to drop that line into the invoice. Rates ship at 0 —
   set yours once, hit ★ on the line, and the preset keeps it. Presets
   live in the same local store as the drafts. */
let presets = [];

function drawPresets(){
  $("presets").innerHTML = presets.map((p, i) => {
    const unset = !p.rate;
    const val = p.dynamic === "retainer" ? "auto" : (unset ? "set rate" : "$" + Number(p.rate).toLocaleString("en-US"));
    return '<button data-p="' + i + '" class="' + (unset ? "unset" : "") + '" title="Add: '
      + esc(p.description) + '">' + esc(p.label) + '<b>' + val + '</b>'
      + '<span class="del" data-pdel="' + i + '" title="Delete preset">✕</span></button>';
  }).join("") + '<button data-p="new" title="Add a blank line">+ Blank</button>';

  $("pzhint").textContent = presets.some(p => !p.rate && p.dynamic !== "retainer")
    ? "Chips in orange have no rate yet — add one, type the rate, then hit ★ on the line to save it."
    : "Click a chip to add that line. ★ on any line saves it as a new preset.";

  $("presets").querySelectorAll("[data-p]").forEach(el => el.addEventListener("click", e => {
    if(e.target.dataset.pdel != null) return;           // the ✕ handles itself
    if(el.dataset.p === "new"){ items.push(blank()); }
    else {
      const p = presets[+el.dataset.p];
      let rate = p.rate;
      let description = p.description;
      if(p.dynamic === "retainer"){
        const c = clients.find(x => x.name === $("cName").value.trim());
        rate = (c && c.retainer) || p.rate || 0;
        description += " — " + new Date($("iDate").value + "T12:00:00")
          .toLocaleDateString("en-US",{month:"long",year:"numeric"});
      }
      // A monthly retainer twice on one invoice is almost always a misclick.
      if(p.dynamic === "retainer" && items.some(it => it.description === description)){
        flag("Already on this invoice"); return;
      }
      items.push({description: description, detail: p.detail || "", qty: p.qty || 1,
                  unit: p.unit || "", rate: rate || 0});
    }
    // Drop a leading empty placeholder row so the first click doesn't leave a blank.
    if(items.length > 1 && !items[0].description && !items[0].rate) items.shift();
    drawItems(); paint(); persist();
  }));

  $("presets").querySelectorAll("[data-pdel]").forEach(el => el.addEventListener("click", e => {
    e.stopPropagation();
    presets.splice(+el.dataset.pdel, 1);
    drawPresets(); persist(); flag("Preset removed");
  }));
}

function savePreset(it){
  if(!it || !it.description){ flag("Add a description first"); return; }
  // Strip a trailing "— August 2026" so the preset stays evergreen.
  const label = it.description.replace(/\s*[—–-]\s*[A-Z][a-z]+ \d{4}\s*$/, "").trim();
  const existing = presets.findIndex(p => p.description.toLowerCase() === label.toLowerCase());
  const rec = {label: label.length > 22 ? label.slice(0,21) + "…" : label,
               description: label, detail: it.detail || "", qty: it.qty || 1,
               unit: it.unit || "", rate: it.rate || 0};
  if(existing >= 0){ rec.dynamic = presets[existing].dynamic; rec.label = presets[existing].label;
                     presets[existing] = rec; flag("Preset updated", "saved"); }
  else { presets.push(rec); flag("Preset saved", "saved"); }
  drawPresets(); persist();
}

/* ── Gather + render ──────────────────────────────────────── */
function spec(){
  const terms = $("iTerms").value;
  return {
    number: $("iNum").value, date: $("iDate").value, dueDate: $("iDue").value,
    terms, status: $("iStatus").value,
    client: {name:$("cName").value, company:$("cCompany").value, email:$("cEmail").value,
             address:$("cAddress").value, cityStateZip:$("cCity").value},
    from: FROM,
    items: items.filter(i => i.description || i.rate),
    discount: parseFloat($("aDisc").value || 0),
    shipping: parseFloat($("aShip").value || 0),
    taxRate: parseFloat($("aTax").value || 0) / 100,
    amountPaid: parseFloat($("aPaid").value || 0),
    notes: $("nNotes").value,
    payment: {ach:$("pAch").value, check:$("pCheck").value, link:$("pLink").value,
              note:"Please include invoice number " + $("iNum").value + " with your payment."}
  };
}

function totals(I){
  const sub = I.items.reduce((a,it) => a + (it.qty||0)*(it.rate||0), 0);
  const taxable = sub - (I.discount||0);
  const tax = Math.round(taxable * (I.taxRate||0) * 100) / 100;
  const total = taxable + tax + (I.shipping||0);
  const due = Math.round((total - (I.amountPaid||0)) * 100) / 100;
  return {sub, tax, total, due};
}

function paint(){
  const I = spec(), T = totals(I);

  $("pNum").textContent = "No. " + (I.number || "—");
  $("fNum").textContent = I.number || "—";
  $("fDate").textContent = dt(I.date);
  $("fDue").textContent = dt(I.dueDate);
  $("fTerms").textContent = I.terms;
  $("fAmt").textContent = usd(T.due);

  const c = I.client;
  $("pBill").innerHTML = '<div class="nm">' + esc(c.name || "Client name") + '</div>'
    + [c.company, c.address, c.cityStateZip, c.email].filter(Boolean).map(esc).join("<br>");
  $("pFrom").innerHTML = '<div class="nm">' + FROM.name + '</div>'
    + [FROM.address, FROM.cityStateZip, FROM.email, FROM.web].map(esc).join("<br>");

  $("pItems").innerHTML = I.items.length ? I.items.map(it => '<tr>'
    + '<td class="desc">' + esc(it.description || "—")
      + (it.detail ? '<span class="sm">' + esc(it.detail) + '</span>' : '') + '</td>'
    + '<td class="c">' + (it.qty || 0) + (it.unit ? " " + esc(it.unit) : "") + '</td>'
    + '<td class="r">' + usd(it.rate) + '</td>'
    + '<td class="r money">' + usd((it.qty||0)*(it.rate||0)) + '</td></tr>').join("")
    : '<tr><td class="desc" colspan="4" style="color:#8a8a8a;font-weight:400">Add a line item to get started.</td></tr>';

  let t = '<div class="trow"><span>Subtotal</span><span>' + usd(T.sub) + '</span></div>';
  if(I.discount)  t += '<div class="trow"><span>Discount</span><span>−' + usd(I.discount) + '</span></div>';
  if(I.shipping)  t += '<div class="trow"><span>Travel / expenses</span><span>' + usd(I.shipping) + '</span></div>';
  if(I.taxRate)   t += '<div class="trow"><span>Sales tax (' + (I.taxRate*100).toFixed(3).replace(/0+$/,"").replace(/\.$/,"") + '%)</span><span>' + usd(T.tax) + '</span></div>';
  t += '<div class="trow grand"><span>Total</span><span>' + usd(T.total) + '</span></div>';
  if(I.amountPaid){
    t += '<div class="trow paid"><span>Paid to date</span><span>−' + usd(I.amountPaid) + '</span></div>';
    t += '<div class="trow grand"><span>Balance due</span><span>' + usd(T.due) + '</span></div>';
  }
  $("pTotals").innerHTML = t;

  const p = I.payment;
  let ph = "";
  if(p.ach)   ph += '<b>ACH / bank transfer</b><br>' + esc(p.ach) + '<br><br>';
  if(p.check) ph += '<b>Check</b><br>Payable to ' + esc(p.check) + '<br>' + esc(FROM.address) + '<br>' + esc(FROM.cityStateZip) + '<br><br>';
  ph += esc(p.note);
  if(p.link)  ph += '<br><a class="paylink" href="' + esc(p.link) + '">Pay online →</a>';
  $("pPay").innerHTML = ph;

  $("pNotes").textContent = I.notes || "Thank you for your business.";
  $("pFoot").innerHTML = '<b>' + FROM.name + '</b> · ' + FROM.email + ' · ' + FROM.web
    + '<br>Questions about this invoice? Reply to the email it came from.';
  const st = (I.status || "Sent").toLowerCase();
  $("pStamp").innerHTML = '<span class="stamp ' + st + '">' + esc(I.status) + '</span>';
  $("barsub").textContent = (c.name || "New invoice") + " · " + usd(T.due) + " due";
  summarise();
}

/* ── Terms → due date ─────────────────────────────────────── */
function syncDue(){
  if(dueTouched || !$("iDate").value) return;
  const m = /(\d+)/.exec($("iTerms").value);
  const d = new Date($("iDate").value + "T12:00:00");
  d.setDate(d.getDate() + (m ? +m[1] : 0));
  $("iDue").value = d.toISOString().slice(0,10);
}

/* ── Scale the paper to fit ───────────────────────────────── */
function fit(){
  const w = $("paperWrap").clientWidth - 40;
  const s = Math.min(1, w / (8.5 * 96));
  $("scaler").style.transform = "scale(" + s + ")";
  $("scaler").style.height = ($("inv").offsetHeight * s) + "px";
  $("scaler").style.width = (8.5 * 96) + "px";
}

/* ── Copy helpers ─────────────────────────────────────────── */
function copy(text, btn, label){
  const done = () => { const o = btn.textContent; btn.textContent = label; btn.classList.add("ok");
    setTimeout(() => { btn.textContent = o; btn.classList.remove("ok"); }, 1400); };
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => fallback(text, done));
  else fallback(text, done);
}
function fallback(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = 0;
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ prompt("Copy this:", text); }
  ta.remove();
}

/* ── Wire up ──────────────────────────────────────────────── */
["cName","cCompany","cEmail","cAddress","cCity","iNum","iStatus","aDisc","aShip","aTax","aPaid",
 "nNotes","pAch","pCheck","pLink"].forEach(id => $(id).addEventListener("input", () => { paint(); persist(); }));
$("cName").addEventListener("input", () => {
  if(!$("cName").value.trim()) setOpen("client", true);
});
$("cPick").addEventListener("change", () => {
  if(!$("cPick").value) setOpen("client", true, true);   // "— new client —"
});
$("iDate").addEventListener("input", () => { syncDue(); paint(); persist(); });
$("iTerms").addEventListener("change", () => { syncDue(); paint(); persist(); });
$("iDue").addEventListener("input", () => { dueTouched = true; paint(); persist(); });
$("bAdd").addEventListener("click", () => { items.push(blank()); drawItems(); paint(); persist(); });
$("bPrint").addEventListener("click", () => {
  remember();
  seed = bump($("iNum").value);
  writeStore({draft: snapshotForm(), mem: mem, seed: seed, presets: presets});
  window.print();
  // After printing, roll to the next number so the following invoice is ready.
  setTimeout(() => { $("iNum").value = seed; paint(); persist();
                     flag("Saved · next is " + seed, "saved"); }, 700);
});

$("bJson").addEventListener("click", e => {
  const I = spec();
  delete I.from;
  copy(JSON.stringify(I, null, 2), e.target, "Copied ✓");
});

$("bNotion").addEventListener("click", e => {
  const I = spec(), T = totals(I);
  const row = [
    "Invoice Name: " + (I.client.name || "Client") + " - Invoice " + I.number,
    "Type: Receivable",
    "Client/Vendor: " + (I.client.name || ""),
    "Amount: " + T.due.toFixed(2),
    "Status: " + (I.status === "Paid" ? "Paid" : "Outstanding"),
    "Invoice Date: " + I.date,
    "Due Date: " + (I.dueDate || ""),
    "Notes: " + I.items.map(it => it.description + " (" + it.qty + (it.unit ? " " + it.unit : "") + " @ " + usd(it.rate) + ")").join("; ")
  ].join("\n");
  copy(row, e.target, "Copied ✓");
});

$("bEmail").addEventListener("click", e => {
  const I = spec(), T = totals(I);
  const first = (I.client.company || "").replace(/^Attn:\s*/i, "").split(/[ ,]/)[0]
                || (I.client.name || "there").split(" ")[0];
  const body = [
    "To: " + (I.client.email || "(no email on file)"),
    "Subject: WCStudios invoice " + I.number + " — " + usd(T.due) + " due " + dt(I.dueDate),
    "",
    "Hi " + first + ",",
    "",
    "Invoice " + I.number + " is attached — " + usd(T.due) + ", due " + dt(I.dueDate) + ".",
    "",
    I.items.map(it => "• " + it.description + " — " + usd((it.qty||0)*(it.rate||0))).join("\n"),
    "",
    (I.payment.link ? "You can pay online here: " + I.payment.link + "\n" : "")
      + "Checks are payable to WCStudios, 14301 Martin Drive #606, Eden Prairie, MN 55344.",
    "",
    "Thanks!",
    "Bennett",
    "WCStudios · bennett@wcstudios.co · www.wcstudios.co"
  ].join("\n");
  copy(body, e.target, "Copied ✓");
});

$("cPick").addEventListener("change", () => {
  const c = clients.find(x => x.name === $("cPick").value);
  if(!c) return;
  remember();          // bank the outgoing client's invoice before switching away
  const prev = mem[c.name];

  $("cName").value = c.name;
  // Prefer what you used last time; fall back to the Notion directory.
  $("cCompany").value = (prev && prev.company) || (c.contact ? "Attn: " + c.contact : "");
  $("cEmail").value   = (prev && prev.email)   || c.email || "";
  if(prev && prev.link) $("pLink").value = prev.link;
  if(prev && prev.terms){ $("iTerms").value = prev.terms; dueTouched = false; syncDue(); }
  if(prev && prev.notes) $("nNotes").value = prev.notes;

  if(prev && prev.items && prev.items.length){
    items = JSON.parse(JSON.stringify(prev.items));
    // Roll a monthly retainer line forward to the current month.
    const mo = new Date($("iDate").value + "T12:00:00")
      .toLocaleDateString("en-US",{month:"long",year:"numeric"});
    items.forEach(it => { it.description = it.description.replace(
      /(retainer\s*[—–-]\s*)[A-Z][a-z]+ \d{4}/i, "$1" + mo); });
    flag("Recalled last invoice");
  } else if(c.retainer){
    const mo = new Date($("iDate").value + "T12:00:00")
      .toLocaleDateString("en-US",{month:"long",year:"numeric"});
    items = [{description:"Monthly creative retainer — " + mo, detail:"", qty:1, unit:"mo", rate:c.retainer}];
    flag("Retainer prefilled");
  }
  drawItems(); paint(); persist();
  // It's filled in now — fold it away and let the invoice speak.
  setOpen("client", false); setOpen("items", true);
});

$("bReset").addEventListener("click", () => {
  if(confirm("Clear this invoice? Presets and per-client history are kept.")) init(true);
});

function init(reset){
  const D = window.FINDATA || {};
  const inv = D.invoicing || {};
  clients = inv.clients || (D.retainers || []).map(r => ({name:r.client, retainer:r.monthly}));

  // Retainer clients first — they're the ones invoiced every month.
  const ret = clients.filter(c => c.retainer), rest = clients.filter(c => !c.retainer);
  const opt = c => '<option>' + esc(c.name) + '</option>';
  $("cPick").innerHTML = '<option value="">— new client —</option>'
    + (ret.length ? '<optgroup label="Retainer">' + ret.map(opt).join("") + '</optgroup>' : "")
    + (rest.length ? '<optgroup label="Other clients">' + rest.map(opt).join("") + '</optgroup>' : "");

  const store = readStore();
  mem  = store.mem  || {};
  seed = store.seed || null;
  presets = (store.presets && store.presets.length) ? store.presets
            : JSON.parse(JSON.stringify(inv.presets || []));
  drawPresets();

  // Sensible first state: the work area open, everything else folded —
  // unless there's no client yet, in which case start with Bill to.
  const saved = (!reset && store.draft && store.draft.open) || null;
  const named = !reset && store.draft && (store.draft.cName || "").trim();
  GROUPS.forEach(g => setOpen(g, saved ? !!saved[g] : (g === "items" || (g === "client" && !named))));

  if(!reset && store.draft){
    const d = store.draft;
    FIELDS.forEach(id => { if(d[id] != null) $(id).value = d[id]; });
    items = (d.items && d.items.length) ? d.items : [blank()];
    dueTouched = !!d.dueTouched;
    if(d.cName) $("cPick").value = d.cName;
    drawItems(); paint(); setTimeout(fit, 60);
    flag("Draft restored");
    if(!storageOK) $("barsub").textContent += " · storage blocked here, drafts won't persist";
    return;
  }

  $("iNum").value = seed || inv.nextNumber || "0001";
  $("iDate").value = todayISO();
  $("iTerms").value = inv.defaultTerms || "Net 15";
  ["cName","cCompany","cEmail","cAddress","cCity","aDisc","aShip","aTax","aPaid","pLink"]
    .forEach(id => $(id).value = "");
  $("cPick").value = "";
  dueTouched = false;
  $("nNotes").value = "Thank you — deliverables are posted to the shared project folder.";
  $("pAch").value = "Routing and account details sent separately on request.";
  items = [blank()];
  drawItems(); syncDue(); paint(); setTimeout(fit, 60);
}

$("logo").src = LOGO;
window.addEventListener("resize", fit);
new ResizeObserver(fit).observe(document.getElementById("inv"));

function load(){
  const tryLoad = (srcs, i) => {
    if(i >= srcs.length){ if(!rendered){ init(); } return; }
    const sc = document.createElement("script");
    sc.src = srcs[i] + "?t=" + Date.now();
    sc.onload = () => { sc.remove(); if(window.FINDATA) init(); else tryLoad(srcs, i+1); };
    sc.onerror = () => { sc.remove(); tryLoad(srcs, i+1); };
    document.head.appendChild(sc);
  };
  tryLoad([JSSRC, "finance-data.js"], 0);
}
// Baked-in data first, so there is never an empty widget.
let rendered = false;
if(window.FINDATA){ init(); rendered = true; }
load();
