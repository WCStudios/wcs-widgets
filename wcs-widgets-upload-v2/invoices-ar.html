<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice Tracker</title>
<style>
:root{--bg:#fff;--panel:#fafaf9;--line:#e9e9e7;--hair:#f2f2f0;
 --text:#191918;--muted:#5f5f5c;--faint:#8f8f8b;--accent:#d4551f;--soft:#f2f2f0;
 --over:#c2410c;--overbg:rgba(194,65,12,.10);
 --paid:#15803d;--paidbg:rgba(21,128,61,.10);
 --draft:#7a7a76;--down:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--panel:#1f1f1f;--line:#2e2e2e;--hair:#262626;
 --text:#f2f2f0;--muted:#a3a39e;--faint:#7c7c78;--accent:#f97b47;--soft:#262626;
 --over:#ff8a6b;--overbg:rgba(255,138,107,.13);
 --paid:#5ddd91;--paidbg:rgba(93,221,145,.13);
 --draft:#8b8b86;--down:#ff8a6b}}
*{margin:0;box-sizing:border-box}html,body{width:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;color:var(--text);
 padding:clamp(15px,1.7vw,22px);-webkit-font-smoothing:antialiased}

/* header */
.hd-top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px}
.ttl{font-size:clamp(18px,2.1vw,23px);font-weight:800;letter-spacing:-.55px;line-height:1.1}
.sub{font-size:11px;color:var(--faint);margin-top:4px}
.lbl{font-size:9px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);font-weight:700}
.fig{text-align:right;flex:0 0 auto}
.fig .lbl{margin-bottom:5px}
.hero{font-size:clamp(27px,3.4vw,37px);font-weight:800;letter-spacing:-1.7px;line-height:1;color:var(--accent)}
.meta{display:flex;gap:24px;margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}
.meta .v{font-size:14px;font-weight:800;margin-top:3px;display:block;font-variant-numeric:tabular-nums}
.meta .v.warn{color:var(--over)}

/* invoice cards */
.rows{margin-top:17px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;padding:11px 11px 11px 12px;border-radius:8px;
 background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden;cursor:pointer}
.row:hover{border-color:var(--faint)}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.row.is-over::before{background:var(--over)}
.row.is-paid::before{background:var(--paid)}
.row.is-draft::before{background:repeating-linear-gradient(180deg,var(--line) 0 4px,transparent 4px 8px)}
.r-id{flex:1 1 auto;min-width:0}
.r-cl{font-size:13px;font-weight:800;letter-spacing:-.15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-sub{font-size:10.5px;color:var(--faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-end{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
.amt{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:800;letter-spacing:.7px;
 text-transform:uppercase;padding:3px 7px;border-radius:5px;white-space:nowrap}
.chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 auto}
.c-over{color:var(--over);background:var(--overbg)}
.c-paid{color:var(--paid);background:var(--paidbg)}
.c-due{color:var(--muted);background:var(--soft)}
.c-draft{color:var(--draft);background:transparent;border:1px dashed var(--line);padding:2px 6px}
.c-draft::before{background:transparent;border:1.5px solid currentColor;width:6px;height:6px}
/* Delete stays hidden until the row is hovered - present when wanted, silent
   otherwise, and never a target for a stray click. */
.del{flex:0 0 auto;width:20px;height:20px;padding:0;border-radius:6px;border:1px solid transparent;
 background:transparent;color:var(--faint);font-size:11px;line-height:1;cursor:pointer;
 opacity:0;transition:opacity .12s,color .12s,border-color .12s}
.row:hover .del,.row:hover .edit{opacity:1}
.edit{flex:0 0 auto;height:20px;padding:0 7px;border-radius:6px;border:1px solid var(--line);
 background:transparent;color:var(--muted);font:inherit;font-size:9.5px;font-weight:800;
 letter-spacing:.4px;text-transform:uppercase;cursor:pointer;opacity:0;transition:opacity .12s,
 color .12s,border-color .12s}
.edit:hover{color:var(--accent);border-color:var(--accent)}
.del:hover{color:var(--down);border-color:var(--down)}
.doc{font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--accent);
 opacity:.55;transition:opacity .12s;font-size:9px}
.row:hover .doc{opacity:1}
.doc.none{color:var(--faint)}
.empty{font-size:12px;color:var(--muted);padding:20px 2px}

/* document viewer */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:none;
 flex-direction:column;padding:clamp(10px,2vw,26px)}
.ov.on{display:flex}
.ovh{display:flex;align-items:center;gap:12px;padding:0 2px 11px;color:#fff}
.ovt{flex:1;min-width:0;font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovt small{display:block;font-weight:400;font-size:10px;color:rgba(255,255,255,.62);margin-top:2px;
 white-space:normal}
.ovb{font:inherit;font-size:10.5px;font-weight:700;cursor:pointer;white-space:nowrap;
 border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;padding:6px 11px;border-radius:8px}
.ovb:hover{background:rgba(255,255,255,.12)}
.ovf{flex:1;min-height:0;border:0;border-radius:10px;background:#fff;width:100%}
.ovpages{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.ovpages canvas{max-width:100%;border-radius:10px;box-shadow:0 4px 22px rgba(0,0,0,.5);background:#fff}
.ovmsg{color:rgba(255,255,255,.75);font-size:12px;padding:26px;text-align:center;line-height:1.6}

/* Narrow: the hero drops under the title and the meta row spreads. */
@media (max-width:560px){
  .hd-top{flex-direction:column;align-items:flex-start;gap:12px}
  .fig{text-align:left}
  .meta{width:100%;justify-content:space-between;gap:10px}
  .r-cl{font-size:12.5px}
  .amt{font-size:14px}
  .doc{display:none}   /* truncates to an ellipsis at this width - drop it */
}

/* Native scrollbars render light-mode white on a dark panel unless the page
   declares which way it leans. Declare it, then restyle the bar so it reads as
   part of the widget instead of the browser. Kept at the end of the sheet on
   purpose — an earlier version of this sat above the dark media query and was
   silently overridden. */
:root{color-scheme:light dark}
*{scrollbar-width:thin;scrollbar-color:#c9c9c7 transparent}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c9c9c7;border-radius:9px;
 border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#aeaeac;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
@media (prefers-color-scheme:dark){
  *{scrollbar-color:#3b3b3b transparent}
  ::-webkit-scrollbar-thumb{background:#3b3b3b;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#525252;background-clip:content-box}
}
</style></head><body>

<script>
const JSSRC = "https://wcstudios.github.io/wcs-widgets/finance-data.js";
const usd = n => "$" + Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0});
const SERIES = ["--s1","--s2","--s3","--s4","--s5"];
/* Tolerant of both a plain date and a full ISO timestamp. The live feed sends
   the latter, and blindly appending "T12:00:00" to it produced "Invalid Date". */
const fmtDate = s => {
  if(!s) return "\u2014";
  const d = new Date(String(s).slice(0,10) + "T12:00:00");
  return isNaN(d) ? "\u2014" : d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"2-digit"});
};
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(D){
  if(!D.__live) baked = D;   // keep the slow-moving half to merge onto
  shown = D;
  const s = D.summary;

  /* Newest invoice first. Numbers live inside the title ("... - Invoice 0172 - ..."),
     and the older December rows carry no number at all, so those fall to the
     bottom ordered by date. Sorting here rather than in the worker means the
     baked snapshot and the live feed always agree. */
  const invNo = x => { const m = /invoice\s+#?(\d+)/i.exec(x.name || ""); return m ? +m[1] : null; };
  const ar = (D.ar || []).slice().sort((a, b) => {
    const na = invNo(a), nb = invNo(b);
    if(na !== null && nb !== null) return nb - na;
    if(na !== null) return -1;
    if(nb !== null) return 1;
    return String(b.invoiceDate || "").localeCompare(String(a.invoiceDate || ""));
  });

  /* Four states, no day counts: Draft until it's been sent, Due once it is,
     Overdue past its terms date, Paid when settled. Each ships with a written
     label as well as a colour, so state never rests on hue alone. */
  const state = i => {
    const st = String(i.status || "");
    if(st === "Paid")  return {key:"paid",  label:"Paid",    cls:"c-paid"};
    if(st === "Draft") return {key:"draft", label:"Draft",   cls:"c-draft"};
    // Overdue is checked before Sent so a late invoice reads as late, not sent.
    if((i.daysOverdue || 0) > 0) return {key:"over", label:"Overdue", cls:"c-over"};
    return {key:"due", label:"Sent", cls:"c-due"};
  };

  const marked  = ar.map(i => ({inv: i, st: state(i)}));
  const open    = marked.filter(m => m.st.key !== "paid");
  const overSum = open.filter(m => m.st.key === "over").reduce((t, m) => t + (m.inv.amount || 0), 0);
  const next    = open.filter(m => m.st.key !== "over")
                      .map(m => m.inv.dueDate).filter(Boolean).sort()[0];

  total.textContent = usd(s.arTotal);
  sub.textContent   = "Money owed to WCStudios \u00b7 updated " + fmtDate(D.updated);
  nOpen.textContent = open.length;
  nOver.textContent = overSum ? usd(overSum) : "None";
  nOver.classList.toggle("warn", !!overSum);
  nNext.textContent = next ? fmtDate(next) : "\u2014";

  document.getElementById("empty").style.display = ar.length ? "none" : "block";
  rows.innerHTML = marked.map((m, x) => {
    const i = m.inv;
    const badge = i.pdfUrl ? ' \u00b7 <span class="doc">\u25A4 PDF</span>'
                : (i.notionUrl ? ' \u00b7 <span class="doc none">\u2197 Notion</span>' : '');
    return '<div class="row is-' + m.st.key + '" data-i="' + x + '" title="'
      + (i.pdfUrl ? "Open the invoice PDF" : "Open the Notion record") + '">'
      + '<div class="r-id"><div class="r-cl">' + esc(i.client) + '</div>'
      +   '<div class="r-sub">' + esc(String(i.name || "").replace(i.client + " - ", ""))
      +     ' \u00b7 due ' + fmtDate(i.dueDate) + badge + '</div></div>'
      + '<div class="r-end"><div class="amt">' + usd(i.amount) + '</div>'
      +   '<span class="chip ' + m.st.cls + '">' + m.st.label + '</span></div>'
      + '<button class="edit" data-edit="' + x + '" title="Open this invoice in the builder">Edit</button>'
      + '<button class="del" data-del="' + x + '" title="Delete this invoice">\u2715</button>'
      + '</div>';
  }).join("");

  /* One click opens the PDF, two reopen the invoice in the builder. The single
     click is held briefly so the second can cancel it - otherwise every edit
     would flash the document viewer on its way. */
  rows.querySelectorAll(".row").forEach(el => {
    let timer = null;
    el.addEventListener("click", e => {
      if(e.target.closest(".del") || e.target.closest(".edit")) return;
      clearTimeout(timer);
      timer = setTimeout(() => open_(ar[+el.dataset.i]), 260);
    });
    el.addEventListener("dblclick", e => {
      if(e.target.closest(".del") || e.target.closest(".edit")) return;
      clearTimeout(timer);
      editInBuilder(ar[+el.dataset.i]);
    });
  });

  rows.querySelectorAll("[data-edit]").forEach(btn =>
    btn.addEventListener("click", e => {
      e.stopPropagation();
      editInBuilder(ar[+btn.dataset.edit]);
    }));

  rows.querySelectorAll("[data-del]").forEach(btn =>
    btn.addEventListener("click", e => {
      e.stopPropagation();
      removeInvoice(ar[+btn.dataset.del], btn);
    }));
}

/* The invoice document, shown in place rather than in a new tab so it appears
   without leaving the Notion page. Hosts that refuse framing still work via
   the "Open PDF" button. */
let current = null;
function open_(inv){
  current = inv;
  if(!inv.pdfUrl){ openInNotion(inv.notionUrl); return; }
  document.getElementById("ovt").innerHTML =
    inv.client + " \u2014 " + inv.name.replace(inv.client + " - ","")
    + '<small>' + usd(inv.amount) + ' \u00b7 issued ' + fmtDate(inv.invoiceDate)
    + (inv.pdfSource === "rebuilt"
        ? ' \u00b7 rebuilt from the Notion record \u2014 not the document originally sent' : '')
    + '</small>';
  document.getElementById("ovNotion").style.display = inv.notionUrl ? "" : "none";
  document.getElementById("ov").classList.add("on");
  renderPdf(inv.pdfUrl);
}
function close_(){
  document.getElementById("ov").classList.remove("on");
  document.getElementById("ovPages").innerHTML = '<div class="ovmsg">Loading…</div>';
}

/* Rendered with pdf.js rather than an <iframe>, because Notion serves embeds
   inside a sandboxed frame where the browser's native PDF viewer is often
   blocked. Canvas rendering works the same everywhere. */
/* Self-hosted next to the widget so the embed never depends on a CDN
   staying reachable; cdnjs is only a fallback. */
const PDFJS = [
  ["vendor/pdf.min.js", "vendor/pdf.worker.min.js"],
  ["https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
   "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"]
];
let pdfjsReady = null;

function loadPdfJs(){
  if(pdfjsReady) return pdfjsReady;
  pdfjsReady = new Promise((res, rej) => {
    const attempt = i => {
      if(i >= PDFJS.length) return rej(new Error("pdf.js unavailable"));
      const sc = document.createElement("script");
      sc.src = PDFJS[i][0];
      const timer = setTimeout(() => { sc.onerror = sc.onload = null; sc.remove(); attempt(i+1); }, 3000);
      sc.onload = () => {
        clearTimeout(timer);
        const lib = window["pdfjs-dist/build/pdf"] || window.pdfjsLib;
        if(!lib) return attempt(i+1);
        lib.GlobalWorkerOptions.workerSrc = PDFJS[i][1];
        res(lib);
      };
      sc.onerror = () => { clearTimeout(timer); sc.remove(); attempt(i+1); };
      document.head.appendChild(sc);
    };
    attempt(0);
  });
  return pdfjsReady;
}

async function renderPdf(url){
  const box = document.getElementById("ovPages");
  box.innerHTML = '<div class="ovmsg">Loading…</div>';
  try{
    const lib = await loadPdfJs();
    const doc = await lib.getDocument(url).promise;
    box.innerHTML = "";
    const wide = Math.min(box.clientWidth, 1000);
    for(let n = 1; n <= doc.numPages; n++){
      const page = await doc.getPage(n);
      const base = page.getViewport({scale: 1});
      const scale = (wide / base.width) * (window.devicePixelRatio || 1);
      const vp = page.getViewport({scale: scale});
      const cv = document.createElement("canvas");
      cv.width = vp.width; cv.height = vp.height;
      cv.style.width = wide + "px";
      box.appendChild(cv);
      await page.render({canvasContext: cv.getContext("2d"), viewport: vp}).promise;
    }
  }catch(e){
    // pdf.js unavailable (offline, blocked CDN, local preview) — hand off to
    // the browser's own PDF viewer, and only then give up.
    box.innerHTML = "";
    const fr = document.createElement("iframe");
    fr.className = "ovf"; fr.title = "Invoice PDF"; fr.src = url;
    box.appendChild(fr);
    setTimeout(() => {
      if(!fr.contentWindow || fr.clientHeight < 40){
        box.innerHTML = '<div class="ovmsg">Couldn\u2019t render the PDF inline.<br>'
          + 'Use <b>Open PDF</b> above to view it in a new tab.</div>';
      }
    }, 1500);
  }
}
document.getElementById("ovX").addEventListener("click", close_);
document.getElementById("ov").addEventListener("click", e => { if(e.target.id === "ov") close_(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") close_(); });
document.getElementById("ovNew").addEventListener("click", () => current && window.open(current.pdfUrl, "_blank"));
document.getElementById("ovNotion").addEventListener("click", () => current && openInNotion(current.notionUrl));

function load(){
  // Try the published feed first, fall back to a sibling finance-data.js
  // (lets the same file preview locally before it's pushed to Pages).
  const tryLoad = (srcs, i) => {
    if(i >= srcs.length){ if(!rendered){ document.getElementById("sub").textContent = "data feed offline"; } return; }
    const sc = document.createElement("script");
    sc.src = srcs[i] + "?t=" + Date.now();
    sc.onload = () => { sc.remove(); if(window.FINDATA) render(window.FINDATA); else tryLoad(srcs, i+1); };
    sc.onerror = () => { sc.remove(); tryLoad(srcs, i+1); };
    document.head.appendChild(sc);
  };
  tryLoad([JSSRC, "finance-data.js"], 0);
}
/* ── Instant updates ──────────────────────────────────────────
   A change has to reach GitHub, wait for Pages to publish, and then be fetched
   before the feed knows about it — tens of seconds at best. But the builder
   already knows what it just did, and both widgets are served from the same
   origin, so it can say so directly. The row appears immediately and the feed
   reconciles behind it.

   BroadcastChannel carries it; a localStorage write is the fallback for
   contexts where the channel is unavailable. */
const BUS = "wcs-invoices";
const EVENT_KEY = "wcsInvoiceEvent.v1";

function bucketFor(dueDate){
  if(!dueDate) return "No due date";
  const days = Math.round((Date.now() - Date.parse(dueDate + "T12:00:00Z")) / 86400000);
  if(days <= 0) return "Not yet due";
  if(days <= 30) return "1-30 days";
  if(days <= 60) return "31-60 days";
  if(days <= 90) return "61-90 days";
  return "90+ days";
}

/* Recompute the derived numbers locally so the totals move with the table
   rather than lagging a poll behind it. */
function recompute(D){
  const ar = D.ar || [];
  const round = n => Math.round(n * 100) / 100;
  const by = key => {
    const m = new Map();
    ar.forEach(x => m.set(key(x), (m.get(key(x)) || 0) + x.amount));
    return [...m.entries()];
  };
  D.summary = {...D.summary,
    arTotal: round(ar.reduce((t, x) => t + x.amount, 0)),
    arOverdue: round(ar.filter(x => (x.daysOverdue || 0) > 0).reduce((t, x) => t + x.amount, 0)),
    arCount: ar.length};
  D.arAging = by(x => x.bucket).map(([bucket, amount]) => ({bucket, amount: round(amount)}))
                               .sort((a, b) => b.amount - a.amount);
  D.arByClient = by(x => x.client).map(([client, amount]) => ({client, amount: round(amount)}))
                                  .sort((a, b) => b.amount - a.amount);
  return D;
}

function onInvoiceEvent(ev){
  if(!ev || !ev.invoice || !shown) return;
  const D = JSON.parse(JSON.stringify(shown));
  D.ar = D.ar || [];
  const inv = ev.invoice;
  const match = r => (inv.notionPageId && r.notionPageId === inv.notionPageId)
                  || (r.name && inv.name && r.name === inv.name);

  if(ev.kind === "deleted"){
    D.ar = D.ar.filter(r => !match(r));
    entomb(inv);
  } else {
    const row = {
      notionPageId: inv.notionPageId || null, name: inv.name, client: inv.client,
      project: inv.project || null, terms: inv.terms || null, items: inv.items || [],
      amount: inv.amount || 0, status: inv.status || "Draft",
      invoiceDate: inv.invoiceDate || null, dueDate: inv.dueDate || null,
      daysOverdue: 0, bucket: bucketFor(inv.dueDate), threaded: !!inv.threaded,
      notionUrl: inv.notionUrl || null, pdfUrl: null, pdfSource: "pending"
    };
    const at = D.ar.findIndex(match);
    if(at >= 0) D.ar[at] = {...D.ar[at], ...row}; else D.ar.unshift(row);
  }

  render(recompute(D));
  chaseFeed();   // let the real feed catch up and correct anything
}

/* After a change, poll harder for a short while instead of waiting out the
   idle interval — Pages usually publishes within this window. */
function chaseFeed(){
  [2000, 5000, 11000, 20000, 35000].forEach(ms => setTimeout(applyLive, ms));
}

try {
  const ch = new BroadcastChannel(BUS);
  ch.onmessage = e => onInvoiceEvent(e.data);
} catch(e){ /* fall back to the storage event below */ }
window.addEventListener("storage", e => {
  if(e.key !== EVENT_KEY || !e.newValue) return;
  try { onInvoiceEvent(JSON.parse(e.newValue)); } catch(err){}
});

/* Anything the builder recorded while this widget was not on screen. The feed's
   own `updated` stamp is the watermark, so an event is replayed only while the
   published feed is still behind it — once the feed catches up, or if it never
   does, the same guard stops the row being applied twice. */
const EVENT_LOG = "wcsInvoiceLog.v1";
const TOMBS = "wcsInvoiceTombs.v1";

/* A delete archives the Notion row, but the widget still renders whatever the
   published feed says. While the feed is behind — or, as happened here, stuck —
   the next poll hands the deleted row straight back. Record what was removed
   and keep filtering it out until a feed arrives that was built after the
   delete; at that point the feed is authoritative again and the tombstone is
   dropped. So this cannot hide a row that genuinely still exists. */
function tombs(){
  try { return JSON.parse(localStorage.getItem(TOMBS) || "[]").filter(Boolean); }
  catch(e){ return []; }
}
function entomb(row){
  if(!row) return;
  const list = tombs();
  list.push({id: row.notionPageId || null, name: row.name || null, at: Date.now()});
  try { localStorage.setItem(TOMBS, JSON.stringify(list.slice(-50))); } catch(e){}
}
/* Anything the feed has already caught up on stops being filtered. */
function pruneTombs(feedUpdated){
  const mark = Date.parse(feedUpdated || "") || 0;
  const keep = tombs().filter(t => t.at > mark);
  try { localStorage.setItem(TOMBS, JSON.stringify(keep)); } catch(e){}
  return keep;
}
function withoutDeleted(feed){
  const live = pruneTombs(feed.updated);
  if(!live.length) return feed;
  const gone = r => live.some(t =>
    (t.id && r.notionPageId === t.id) || (t.name && r.name === t.name));
  return {...feed, ar: (feed.ar || []).filter(r => !gone(r))};
}
function drainLog(){
  if(!shown) return;
  let log = [];
  try { log = JSON.parse(localStorage.getItem(EVENT_LOG) || "[]"); } catch(e){ return; }
  const mark = Date.parse(shown.updated || "") || 0;
  log.filter(e => e && e.at > mark)
     .sort((a, b) => a.at - b.at)
     .forEach(e => { try { onInvoiceEvent(e); } catch(err){} });
}

/* ── Editing and deleting ─────────────────────────────────────
   The builder lives on another Notion page, so the row is handed over through
   localStorage: both widgets are served from the same origin, so they share a
   store even though they sit in different embeds. The builder picks the handoff
   up on load and clears it.

   Deleting reuses the worker's void action, which archives the Notion row —
   recoverable from Notion's trash rather than destroyed. Connection details are
   the same ones entered once in the builder's gear. */
/* Retarget the tab the widget already sits in rather than opening a second one.
   Notion's embed sandbox carries allow-top-navigation-by-user-activation, so a
   click may do this. No timed fallback here on purpose — a timer cannot tell a
   blocked navigation from a slow one, and guessing wrong opens the extra tab
   it was supposed to prevent. */
function openInNotion(url){
  if(!url) return;
  // Inside the Notion app an https:// navigation from an embed is handed to the
  // default browser, so hand the app its own scheme instead and stay put.
  if(/Notion|Electron/i.test(navigator.userAgent)){
    window.open(url.replace(/^https:\/\/app\.notion\.com/, "https://www.notion.so")
                  .replace(/^https:\/\//, "notion://"), "_blank");
    return;
  }
  window.top.location.href = url;
}

const HANDOFF = "wcsInvoiceHandoff.v1";
const CONN = "wcsWorkerConn.v1";
const BUILDER_PAGE = "https://app.notion.com/p/3c2421efc76680a796b6ce25ac3768b8";

function conn(){
  try { return JSON.parse(localStorage.getItem(CONN) || "{}"); } catch(e){ return {}; }
}

function editInBuilder(row){
  if(!row) return;
  try {
    localStorage.setItem(HANDOFF, JSON.stringify({ at: Date.now(), invoice: row }));
  } catch(e){
    flash("This browser won't allow the handoff");
    return;
  }
  openInNotion(BUILDER_PAGE);
  flash("Opening in the builder…");
}

async function removeInvoice(row, btn){
  // Only rows from the live feed carry a Notion id. Baked snapshot rows don't,
  // so say why rather than failing blankly.
  if(!row || !row.notionPageId){ flash("Waiting on the live feed \u2014 try again in a moment"); return; }
  const c = conn();
  if(!c.url || !c.key){ flash("Connect the worker in the builder first"); return; }

  const card = btn.closest(".row");
  card.style.opacity = ".35";
  try {
    await fetch(c.url, {
      method: "POST",
      mode: "no-cors",                       // the endpoint sends no CORS headers
      headers: {"Content-Type": "text/plain"},   // safelisted, so no preflight
      body: JSON.stringify({
        key: c.key, action: "void",
        payload: { notionPageId: row.notionPageId, number: null }
      })
    });
    announce("deleted", row);
    flash("Deleted \u00b7 recoverable from Notion's trash");
    chaseFeed();
  } catch(e){
    card.style.opacity = "";
    flash("Couldn't reach the worker");
  }
}

/* Tell every other widget on this origin what just happened. */
function announce(kind, invoice){
  const msg = {kind, invoice, at: Date.now()};
  try { new BroadcastChannel(BUS).postMessage(msg); } catch(e){}
  try { localStorage.setItem(EVENT_KEY, JSON.stringify(msg)); } catch(e){}
  try {
    const cut = Date.now() - 30 * 60 * 1000;
    const log = JSON.parse(localStorage.getItem(EVENT_LOG) || "[]").filter(e => e && e.at > cut);
    log.push(msg);
    localStorage.setItem(EVENT_LOG, JSON.stringify(log.slice(-25)));
  } catch(e){}
  onInvoiceEvent(msg);          // this widget too
}

/* Small transient message in the subtitle line. */
function flash(text){
  const el = document.getElementById("sub");
  const was = el.textContent;
  el.textContent = text;
  clearTimeout(flash.t);
  flash.t = setTimeout(() => { if(el.textContent === text) el.textContent = was; }, 3000);
}

/* ── Live overlay ─────────────────────────────────────────────
   finance-data.js is a snapshot; receivables move constantly. The worker
   republishes just the AR slice to the widget repo after every change, and
   raw.githubusercontent.com serves it with CORS and no build step — unlike
   Pages, which would take a minute. If it's missing or unreachable the baked
   data simply stands, so this can only ever add freshness. */
/* Two sources for the same file, because neither is reliably fresh on its own.
   Pages sits beside this widget (same origin, no CORS) and purges on each
   commit; raw.githubusercontent has a 5-minute edge cache that ignores
   cache-busting query strings — measured 3 minutes behind Pages. Ask both and
   keep whichever reports the newer timestamp. */
const LIVE_SRCS = [
  "ar-live.json",
  "https://raw.githubusercontent.com/wcstudios/wcs-widgets/main/wcs-widgets-upload-v2/ar-live.json"
];
let baked = null, liveAt = null, shown = null;

function applyLive(){
  if(!baked) return;
  const bust = "?t=" + Date.now();
  Promise.all(LIVE_SRCS.map(u =>
    fetch(u + bust, {cache: "no-store"}).then(r => r.ok ? r.json() : null).catch(() => null)
  )).then(feeds => {
      const live = feeds.filter(f => f && Array.isArray(f.ar))
                        .sort((a, b) => (b.updated || "").localeCompare(a.updated || ""))[0];
      if(!live) return;
      if(live.updated === liveAt) return;   // nothing new since last poll
      liveAt = live.updated;
      const clean = withoutDeleted(live);
      const dropped = (live.ar || []).length - (clean.ar || []).length;
      const view = {
        ...baked,
        __live: true,
        ar: clean.ar,
        arAging: live.arAging || baked.arAging,
        arByClient: live.arByClient || baked.arByClient,
        updated: live.updated,
        summary: {...baked.summary, ...live.summary}
      };
      // Totals must follow the rows on screen, or a filtered row still counts.
      render(dropped ? recompute(view) : view);
      drainLog();
      // live.updated is a full ISO timestamp; fmtDate wants a plain date.
      document.getElementById("sub").textContent =
        "Money owed to WCStudios \u00b7 live \u00b7 " + fmtDate(String(live.updated).slice(0, 10));
    })
    .catch(() => {});   // stay on the baked snapshot
}

// Baked-in data first, so there is never an empty widget.
let rendered = false;
if(window.FINDATA){ render(window.FINDATA); rendered = true; }
load();
setInterval(load, 300000);
setTimeout(() => { applyLive(); drainLog(); }, 400);
setInterval(applyLive, 20000);
// Coming back to the tab should feel current, not 45 seconds stale.
document.addEventListener("visibilitychange", () => { if(!document.hidden) applyLive(); });
</script></body></html>
