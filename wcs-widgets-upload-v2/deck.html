<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>WCStudios</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deck.css?v=2">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--acc:#e8622c}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{transform-origin:center center}
/* controls */
#bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;
 background:rgba(18,18,18,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);
 border-radius:14px;padding:6px;opacity:0;transition:opacity .25s;z-index:20;color:#eee}
body.ui #bar{opacity:1}
#bar button{background:none;border:0;color:inherit;font:600 12px Inter;letter-spacing:.4px;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px}
#bar button:hover{background:rgba(255,255,255,.1)}
#bar .ct{font:600 12px Inter;color:#aaa;padding:0 10px;font-variant-numeric:tabular-nums;min-width:62px;text-align:center}
#bar svg{width:16px;height:16px}
#bar .sep{width:1px;height:20px;background:rgba(255,255,255,.12);margin:0 2px}
#prog{position:fixed;left:0;top:0;height:3px;background:var(--acc);z-index:21;transition:width .35s ease}
.hit{position:fixed;top:0;bottom:0;width:22%;z-index:10;cursor:pointer}
.hit.l{left:0}.hit.r{right:0}

#notes{position:fixed;left:0;right:0;bottom:0;max-height:34vh;overflow:auto;background:rgba(14,14,14,.94);color:#ddd;
 border-top:1px solid rgba(255,255,255,.12);padding:18px 26px 70px;font-size:15px;line-height:1.55;z-index:15;display:none}
#notes.on{display:block}
#notes h6{font:700 10px Inter;letter-spacing:1.6px;text-transform:uppercase;color:var(--acc);margin-bottom:8px}

#overview{position:fixed;inset:0;background:#0b0b0b;z-index:30;overflow:auto;padding:40px;display:none}
#overview.on{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;align-content:start}
#overview .th{aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:10px;border:1px solid rgba(255,255,255,.1);cursor:pointer}
#overview .th.cur{outline:2px solid var(--acc);outline-offset:3px}
#overview .th .inner{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;pointer-events:none}
#overview .th .inner .slide{opacity:1;visibility:visible;transition:none}
#overview .th span{position:absolute;left:10px;bottom:8px;font:700 11px Inter;color:#fff;background:rgba(0,0,0,.6);padding:3px 7px;border-radius:6px;z-index:3}

#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#ddd;z-index:40;background:#0b0b0b;text-align:center;padding:30px}
#msg .mk{font-family:Archivo;font-variation-settings:"wdth" 125;font-weight:900;font-size:30px;letter-spacing:1px;color:#fff}
#msg .mk b{color:var(--acc)}
#msg p{font-size:14px;color:#8a8a8a;max-width:420px;line-height:1.5}
#msg.load .mk{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

@media print{
 @page{size:1920px 1080px;margin:0}
 html,body{background:#fff;overflow:visible;height:auto}
 #bar,#prog,.hit,#notes,#overview,#msg{display:none!important}
 #viewport{position:static;display:block}
 #stage{transform:none!important;width:auto;height:auto;background:none;overflow:visible}
 .slide{position:relative;width:1920px;height:1080px;opacity:1!important;visibility:visible!important;page-break-after:always;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .slide .rise{animation:none!important}
}
</style></head><body>
<div id="prog"></div>
<div id="viewport"><div id="stage" class="wcs-stage"></div></div>
<div class="hit l" id="hl"></div><div class="hit r" id="hr"></div>
<div id="notes"></div>
<div id="overview"></div>
<div id="bar">
 <button id="bPrev" title="Previous (←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg></button>
 <span class="ct" id="ct">1 / 1</span>
 <button id="bNext" title="Next (→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 18l6-6-6-6"/></svg></button>
 <span class="sep"></span>
 <button id="bGrid" title="All slides (G)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Slides</button>
 <button id="bNotes" title="Speaker notes (N)" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 10h16M4 15h10"/></svg>Notes</button>
 <button id="bPdf" title="Save as PDF (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14"/></svg>PDF</button>
 <button id="bFull" title="Present full screen (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Present</button>
</div>
<div id="msg" class="load"><div class="mk"><b>WCS</b>TUDIOS</div><p id="msgt">Loading</p></div>

<script src="deck-render.js?v=2"></script>
<script>
(() => {
const W = window.WCSDeck;
const $ = (s, el = document) => el.querySelector(s);
const qs = new URLSearchParams(location.search);
const SLUG = (qs.get("d") || "").replace(/[^a-f0-9]/g, "");
const [K_DECK, K_NOTES] = location.hash.slice(1).split(".");
const BASE = location.href.replace(/[^/]*([?#].*)?$/, "");
const RAW = "https://raw.githubusercontent.com/wcstudios/wcs-widgets/main/wcs-widgets-upload-v2/";

function fail(t){ const m = $("#msg"); m.classList.remove("load"); $("#msgt").textContent = t; m.style.display = "flex"; }

const b64 = s => Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/") + "===".slice((s.length + 3) % 4)), c => c.charCodeAt(0));
async function key(raw){ return crypto.subtle.importKey("raw", b64(raw), "AES-GCM", false, ["decrypt"]); }
async function open(k, bytes){ return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0, 12) }, k, bytes.slice(12))); }
async function fetchBytes(path){
  for (const u of [BASE + path + "?t=" + Date.now(), RAW + path + "?t=" + Date.now()]) {
    try { const r = await fetch(u, { cache: "no-store" }); if (r.ok) return new Uint8Array(await r.arrayBuffer()); } catch(e){}
  }
  throw new Error("missing");
}

/* ── media ─────────────────────────────────── */
let DECK_KEY, media = {};
async function resolveMedia(u){
  if (!u || !u.startsWith("enc:")) return u;
  const name = u.slice(4);
  if (media[name]) return media[name];
  const pt = await open(DECK_KEY, await fetchBytes("decks/" + SLUG + "/" + name));
  const ml = pt[0], mime = new TextDecoder().decode(pt.slice(1, 1 + ml));
  return media[name] = URL.createObjectURL(new Blob([pt.slice(1 + ml)], { type: mime }));
}
/* ── boot ──────────────────────────────────── */
let slides = [], cur = 0, notesBy = {}, deck;
const stage = $("#stage");

function fit(){
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `scale(${s})`;
}
async function hydrate(root){
  for (const el of root.querySelectorAll("[data-bg]")) {
    try { el.style.backgroundImage = `url("${await resolveMedia(el.dataset.bg)}")`; } catch(e){}
    el.removeAttribute("data-bg");
  }
  for (const el of root.querySelectorAll("img[data-src]")) {
    try { el.src = await resolveMedia(el.dataset.src); } catch(e){}
    el.removeAttribute("data-src");
  }
}
function go(i, push = true){
  i = Math.max(0, Math.min(slides.length - 1, i));
  const prev = slides[cur];
  if (prev) { prev.el.classList.remove("on"); prev.el.querySelectorAll("iframe[src]").forEach(f => { f.dataset.src = f.src; f.removeAttribute("src"); }); }
  cur = i;
  const s = slides[i];
  s.el.classList.add("on");
  s.el.querySelectorAll("iframe[data-src],video[data-src]").forEach(f => { f.src = f.dataset.src; f.removeAttribute("data-src"); });
  $("#ct").textContent = `${i + 1} / ${slides.length}`;
  $("#prog").style.width = ((i + 1) / slides.length * 100) + "%";
  const n = notesBy[s.ix];
  $("#notes").innerHTML = `<h6>Notes · slide ${i + 1}</h6>` + (n ? W.bodyHTML(n).replace(/class="[^"]*rise[^"]*"/g, "") : "<p style='color:#777'>No notes on this slide.</p>");
  if (push) { const u = new URL(location.href); u.searchParams.set("s", i + 1); history.replaceState(null, "", u); }
  [i + 1, i + 2].forEach(k => slides[k] && hydrate(slides[k].el));
}
function overview(on){
  const ov = $("#overview");
  if (!on) { ov.classList.remove("on"); ov.innerHTML = ""; return; }
  ov.innerHTML = "";
  slides.forEach((s, k) => {
    const th = document.createElement("div");
    th.className = "th" + (k === cur ? " cur" : "");
    const inner = document.createElement("div");
    inner.className = "inner wcs-stage" + (deck.theme === "light" ? " light" : "");
    const clone = s.el.cloneNode(true); clone.classList.add("on");
    clone.querySelectorAll("iframe,video").forEach(f => f.remove());
    inner.appendChild(clone);
    th.appendChild(inner);
    th.insertAdjacentHTML("beforeend", `<span>${k + 1}</span>`);
    th.onclick = () => { overview(false); go(k); };
    ov.appendChild(th);
    requestAnimationFrame(() => { inner.style.transform = `scale(${th.clientWidth / 1920})`; });
  });
  ov.classList.add("on");
}
async function printAll(){
  for (const s of slides) await hydrate(s.el);
  window.print();
}

async function boot(){
  if (!SLUG || !K_DECK) return fail("This link is incomplete. Ask WCStudios for a fresh one.");
  if (!window.crypto || !crypto.subtle) return fail("This browser can't open the deck. Try Chrome or Safari.");
  try {
    DECK_KEY = await key(K_DECK);
    const env = JSON.parse(new TextDecoder().decode(await fetchBytes("decks/" + SLUG + ".json")));
    deck = JSON.parse(new TextDecoder().decode(await open(DECK_KEY, b64(env.data))));
  } catch(e) { return fail("This deck could not be opened. The link may be out of date."); }
  document.title = (deck.title || "Deck") + " · WCStudios";
  if (deck.theme === "light") stage.classList.add("light"), stage.style.setProperty("--acc", "#d4551f");
  if (K_NOTES && deck.notes) {
    try { notesBy = JSON.parse(new TextDecoder().decode(await open(await key(K_NOTES), b64(deck.notes)))); $("#bNotes").hidden = false; } catch(e){}
  }
  const cs = W.chunks(deck.nodes || []);
  cs.forEach((c, k) => c.layout = W.classify(c, k === 0));
  slides = cs;
  slides.forEach((s, k) => { s.el = W.render(s, k, slides.length, deck); stage.appendChild(s.el); });
  if (!slides.length) return fail("This deck has no slides yet.");
  fit();
  await hydrate(slides[0].el);
  $("#msg").style.display = "none";
  const start = Math.max(1, parseInt(qs.get("s") || "1", 10)) - 1;
  go(start, false);
  for (const s of slides) await hydrate(s.el);
}

addEventListener("resize", fit);
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if ($("#overview").classList.contains("on")) { if (k === "Escape" || k === "g") overview(false); return; }
  if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(k)) { e.preventDefault(); go(cur + 1); }
  else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); go(cur - 1); }
  else if (k === "Home") go(0); else if (k === "End") go(slides.length - 1);
  else if (k === "f") fullscreen();
  else if (k === "g") overview(true);
  else if (k === "n" && !$("#bNotes").hidden) $("#notes").classList.toggle("on");
  else if (k === "p") printAll();
});
function fullscreen(){
  const d = document;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else {
    const el = d.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) req.call(el).catch(() => window.open(location.href, "_blank", "noopener"));
    else window.open(location.href, "_blank", "noopener");
  }
}
$("#hl").onclick = () => go(cur - 1);
$("#hr").onclick = () => go(cur + 1);
$("#bPrev").onclick = () => go(cur - 1);
$("#bNext").onclick = () => go(cur + 1);
$("#bGrid").onclick = () => overview(true);
$("#bNotes").onclick = () => $("#notes").classList.toggle("on");
$("#bPdf").onclick = printAll;
$("#bFull").onclick = fullscreen;
let hideT;
addEventListener("mousemove", () => { document.body.classList.add("ui"); clearTimeout(hideT); hideT = setTimeout(() => document.body.classList.remove("ui"), 2200); });
let tx = null;
addEventListener("touchstart", e => { tx = e.touches[0].clientX; document.body.classList.add("ui"); }, { passive: true });
addEventListener("touchend", e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1)); tx = null; });
boot();
})();
</script>
</body></html>
