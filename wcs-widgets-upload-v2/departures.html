<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Departures</title>
<style>
/* Matched to Notion's dark canvas and to the home strip's accent, so the board
   reads as part of the page rather than a darker object dropped onto it. */
:root{--bg:#191919;--panel:#1f1f1f;--flap:#242424;--line:#2c2c2c;--hair:#232323;
 --text:#f0f0f0;--muted:#a3a39e;--faint:#7c7c78;--accent:#f97b47;--track:rgba(249,123,71,.16);
 --steel:#7f9ab0;--steelbg:rgba(127,154,176,.14);
 --amber:#d9a441;--amberbg:rgba(217,164,65,.15)}
*{margin:0;box-sizing:border-box}
html,body{height:100%;width:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;color:var(--text);
 -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}

.hd{flex:0 0 auto;padding:16px 16px 12px}
.brand{font-size:9px;letter-spacing:2.4px;text-transform:uppercase;color:var(--faint);font-weight:800}
.ttl{display:flex;align-items:center;gap:7px;margin-top:6px;
 font-size:13.5px;font-weight:800;letter-spacing:-.2px}
.lamp{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto;
 box-shadow:0 0 0 3px var(--track);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.board{flex:1;min-height:0;overflow-y:auto;padding:0 16px}
.grid{display:grid;grid-template-columns:1fr;border:1px solid var(--line);border-radius:9px;
 overflow:hidden;background:var(--line);gap:1px}
.row{background:var(--bg);display:block;text-decoration:none;color:inherit;
 padding:12px 12px 11px;transition:background .14s}
.row:hover{background:var(--panel)}

/* Split-flap line. The cell count is computed from the widget's real width, so
   a wider embed shows more of the project name instead of clipping it at a
   number I picked in advance. */
.flaps{display:flex;gap:1.5px}
.fl{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
 font-size:10.5px;font-weight:700;line-height:1;
 width:10px;height:16px;flex:0 0 10px;
 display:flex;align-items:center;justify-content:center;
 background:var(--flap);border-radius:2px;color:var(--text);position:relative;overflow:hidden}
.fl::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.45)}
.fl.sp{background:transparent}
.row.shoot .fl:not(.sp){color:var(--accent)}

.meta{display:flex;align-items:center;gap:6px;margin-top:9px}
.chip{font-size:8.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
 padding:3px 7px;border-radius:5px;white-space:nowrap;flex:0 0 auto}
.c-client{color:var(--muted);background:var(--flap)}
.c-shoot{color:var(--accent);background:var(--track)}
.c-post{color:var(--steel);background:var(--steelbg)}
.c-rev{color:var(--amber);background:var(--amberbg)}
.due{margin-left:auto;flex:0 0 auto;font-size:9px;letter-spacing:1px;text-transform:uppercase;
 font-weight:800;color:var(--faint);font-variant-numeric:tabular-nums}
.due b{color:var(--muted);font-weight:800}
.row.soon .due b{color:var(--accent)}

.ft{flex:0 0 auto;padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--panel)}
.ftk{font-size:7.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);
 font-weight:800;margin-bottom:8px}
.dock{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dk{height:28px;border-radius:7px;border:1px solid var(--line);background:var(--bg);
 display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;
 color:var(--muted);text-decoration:none;transition:all .14s;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.dk:hover{border-color:var(--accent);color:var(--accent);background:var(--track)}
@media (min-width:460px){ .dock{grid-template-columns:repeat(6,1fr)} }
@media (max-width:250px){ .dock{grid-template-columns:repeat(2,1fr)} }

:root{color-scheme:dark}
*{scrollbar-width:thin;scrollbar-color:#3b3b3b transparent}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3b3b3b;border-radius:8px;
 border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#525252;background-clip:content-box}
</style></head><body>

<div class="hd">
  <div class="brand">WCStudios</div>
  <div class="ttl"><span class="lamp"></span>Departures</div>
</div>
<div class="board"><div class="grid" id="grid"></div></div>
<div class="ft">
  <div class="ftk">Quick links</div>
  <div class="dock" id="dock"></div>
</div>

<script>
const HOME = "86b6278818f54a438240f0422f3d4b07";
const peek = id => "https://www.notion.so/" + HOME + "?p=" + String(id).replace(/-/g,"") + "&pm=s";
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const LINKS = [
  {n:"Website",   u:"https://www.wcstudios.co"},
  {n:"Dropbox",   u:"https://www.dropbox.com/home/WCStudios%20Team"},
  {n:"Instagram", u:"https://www.instagram.com/wcstudios.co/"},
  {n:"Vimeo",     u:"https://vimeo.com/wcstudios"},
  {n:"Audiio",    u:"https://audiio.com/"},
  {n:"Musicbed",  u:"https://www.musicbed.com/songs"}
];

/* `title` holds the full project name — the flap line shows as much of it as
   the widget's width allows, so a wider embed genuinely reveals more.
   `status` is the real Tasks status rather than a label I derived. */
const BOARD = [
  {title:"Honda Dealership Videos",      client:"Walser",    status:"Post Prod.", due:"2026-08-24", id:"3a5421efc766817d8024c961be3728db"},
  {title:"CJD Dealership Videos",        client:"Walser",    status:"To Shoot",   due:"2026-08-27", id:"3ab421efc76681d9afcfdd8ffdf24a1c"},
  {title:"The Great Northern Advisors",  client:"RBC",       status:"Post Prod.", due:"2026-08-28", id:"3a6421efc766815baf3dd4bb20a726ac"},
  {title:"HF Golf Tourney Recap",        client:"Pulltab",   status:"Pre Prod.",  due:"2026-08-31", id:"3c2421efc766805b8bb8f3c926d22b34"},
  {title:"Development Project Spotlight",client:"Tradition", status:"To Shoot",   due:"2026-09-01", id:"3b8421efc766813a8f62d2609d4502e1"},
  {title:"Employee Retreat",             client:"Tradition", status:"Post Prod.", due:"2026-09-02", id:"1b96e02b4ebf4d33b116ba8f9a2cc5e8"},
  {title:"Fall Parade of Homes",         client:"Tradition", status:"To Shoot",   due:"2026-09-03", id:"3b8421efc76681378e88d42418a26c21"},
  {title:"Hazeltine Bank Event",         client:"Tradition", status:"To Shoot",   due:"2026-09-09", id:"37c421efc766815fb90af86cfd418199"},
  {title:"Gateway Advisor Interviews",   client:"RBC",       status:"To Shoot",   due:"2026-09-17", id:"3b9421efc766819b9bbed20261528a12"}
];

const MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 -.&";
const CELL_W = 11.5;                    // 10px cell + 1.5px gap
const MIN_CELLS = 12, MAX_CELLS = 44;
const today = new Date(); today.setHours(0,0,0,0);
const out = iso => Math.round((new Date(iso+"T00:00:00") - today)/86400000);

const chipClass = st => /shoot/i.test(st) ? "c-shoot" : /rev/i.test(st) ? "c-rev" : "c-post";

/* One shared cell count for the whole board, measured off a real row. Every row
   uses it, so the character grid stays flush however wide the embed gets. */
function cellCount(){
  const inner = document.getElementById("grid").clientWidth - 24 - 2;   // row padding + border
  return Math.max(MIN_CELLS, Math.min(MAX_CELLS, Math.floor(inner / CELL_W)));
}
function fit(s, n){
  s = String(s).toUpperCase();
  return (s.length > n ? s.slice(0, n-1) + "." : s).padEnd(n, " ");
}
function cells(text, n){
  return '<span class="flaps">' + [...fit(text, n)].map((ch,i) =>
    '<span class="fl'+(ch===" "?" sp":"")+'" data-f="'+esc(ch)+'" data-i="'+i+'">'+esc(ch)+'</span>'
  ).join("") + '</span>';
}

function render(){
  const n = cellCount();
  document.getElementById("grid").innerHTML = BOARD.map(b => {
    const d = new Date(b.due+"T12:00:00");
    const o = out(b.due);
    const shoot = /shoot/i.test(b.status);
    return '<a class="row '+(shoot?"shoot ":"")+(o<=2?"soon":"")+'" href="'+peek(b.id)+'" target="_top">'
      + cells(b.title, n)
      + '<span class="meta">'
      +   '<span class="chip c-client">'+esc(b.client)+'</span>'
      +   '<span class="chip '+chipClass(b.status)+'">'+esc(b.status)+'</span>'
      +   '<span class="due">Due <b>'+MON[d.getMonth()]+' '+String(d.getDate()).padStart(2,"0")+'</b></span>'
      + '</span></a>';
  }).join("");
}

document.getElementById("dock").innerHTML = LINKS.map(l =>
  '<a class="dk" href="'+l.u+'" target="_blank" rel="noopener">'+esc(l.n)+'</a>').join("");

/* Cells riffle through the character set then settle, staggered by column so
   the board resolves left to right the way a real one does. */
function riffle(){
  document.querySelectorAll(".fl").forEach(el => {
    const fin = el.dataset.f;
    if(fin === " ") return;
    const delay = (+el.dataset.i) * 30 + Math.random()*70;
    let k = 0;
    setTimeout(() => {
      const t = setInterval(() => {
        el.textContent = CHARS[Math.floor(Math.random()*CHARS.length)];
        if(++k > 6){ clearInterval(t); el.textContent = fin; }
      }, 40);
    }, delay);
  });
}

render(); riffle();

/* Re-fit on resize so widening the embed reveals more of each title. Debounced,
   and only when the cell count actually changed — otherwise every pixel of a
   drag would restart the animation. */
let last = cellCount(), rt;
addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    const n = cellCount();
    if(n !== last){ last = n; render(); riffle(); }
  }, 160);
});
document.addEventListener("visibilitychange", () => { if(!document.hidden) riffle(); });
</script>
</body></html>
