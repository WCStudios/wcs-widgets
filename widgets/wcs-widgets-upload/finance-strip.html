<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>WCS Finance Strip</title>
<style>
:root{--bg:#fff;--line:#ececec;--text:#111;--muted:#8a8a8a;--accent:#e8622c;--soft:#f2f2f2;
 --up:#0ca30c;--down:#d03b3b;--warn:#fab219}
@media (prefers-color-scheme:dark){:root{--bg:#171717;--line:#2a2a2a;--text:#f4f4f4;--muted:#8a8a8a;--soft:#262626}}
*{margin:0;box-sizing:border-box}html,body{height:100%;width:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;color:var(--text)}
.strip{display:flex;height:100%;width:100%;overflow-x:auto}
.panel{flex:1 1 0;min-width:190px;padding:clamp(14px,1.6vw,22px);border-right:1px solid var(--line);
 display:flex;flex-direction:column;justify-content:center;position:relative}
.panel:last-child{border-right:none}
.panel.click{cursor:pointer}
.k{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.big{font-size:clamp(26px,3.2vw,44px);font-weight:800;letter-spacing:-1.5px;line-height:1;margin-top:10px}
.sub{font-size:11px;color:var(--muted);margin-top:6px}
.delta{font-size:12px;font-weight:700;margin-top:6px;display:flex;align-items:center;gap:5px}
.delta.up{color:var(--up)}.delta.down{color:var(--down)}.delta.flat{color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.row{display:flex;gap:20px;margin-top:14px}
.n{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.nl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.hint{position:absolute;top:12px;right:14px;font-size:9px;color:var(--muted)}
.empty{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45;max-width:24ch}
.pill{display:inline-block;font-size:9px;letter-spacing:.4px;text-transform:uppercase;
 padding:2px 7px;border-radius:10px;background:var(--soft);color:var(--muted);margin-top:9px}
</style></head><body>
<div class="strip">

  <!-- 1 · Cash position -->
  <div class="panel click" id="pCash" title="Click to cycle accounts">
    <div class="hint" id="cashHint"></div>
    <div class="k">Cash position</div>
    <div class="big" id="cashBig">—</div>
    <div class="sub" id="cashSub">loading</div>
    <div id="cashDetail"></div>
  </div>

  <!-- 2 · Outstanding AR -->
  <div class="panel">
    <div class="k">Outstanding invoices</div>
    <div class="big" id="arBig">—</div>
    <div class="delta flat" id="arDelta">—</div>
    <div class="row">
      <div><div class="n" id="arClients">—</div><div class="nl">Clients</div></div>
      <div><div class="n" id="arOldest">—</div><div class="nl">Oldest</div></div>
    </div>
  </div>

  <!-- 3 · Monthly burn -->
  <div class="panel">
    <div class="k">Monthly burn</div>
    <div class="big" id="burnBig">—</div>
    <div class="sub" id="burnSub">contractors, software, utilities</div>
    <div class="row">
      <div><div class="n" id="burnYear">—</div><div class="nl">Per year</div></div>
      <div><div class="n" id="burnItems">—</div><div class="nl">Line items</div></div>
    </div>
  </div>

  <!-- 4 · Monthly net -->
  <div class="panel">
    <div class="k">Retainer income vs burn</div>
    <div class="big" id="netBig">—</div>
    <div class="sub" id="netSub">—</div>
    <div class="row">
      <div><div class="n" id="netClients">—</div><div class="nl">Retainers</div></div>
      <div><div class="n" id="netCover">—</div><div class="nl">Burn covered</div></div>
    </div>
  </div>

</div>
<script>
const JSSRC = "https://wcstudios.github.io/wcs-widgets/finance-data.js";
const usd = n => n == null ? "—" : "$" + Number(n).toLocaleString("en-US",{maximumFractionDigits:0});
const usdk = n => n == null ? "—" : (Math.abs(n) >= 1000
  ? "$" + (n/1000).toFixed(Math.abs(n) < 100000 ? 1 : 0).replace(/\.0$/,"") + "k"
  : "$" + Math.round(n));
let D = null, ai = 0;

function render(){
  if(!D) return;
  const s = D.summary;

  /* ---- 1 · Cash ---- */
  const accts = D.accounts || [];
  const known = accts.filter(a => a.balance != null);
  if(s.cashOnHand == null){
    cashBig.textContent = "Not connected";
    cashBig.style.fontSize = "clamp(17px,1.9vw,24px)";
    cashBig.style.letterSpacing = "-0.5px";
    cashSub.textContent = accts.length + " accounts staged, no balances yet";
    cashDetail.innerHTML = '<span class="pill">Awaiting connection</span>';
    cashHint.textContent = "";
    pCash.classList.remove("click");
  } else {
    const a = known[ai % known.length];
    cashBig.textContent = usd(s.cashOnHand);
    cashSub.textContent = "across " + known.length + " accounts";
    let html = '<div class="row"><div><div class="n">' + usd(s.cardBalance) + '</div><div class="nl">Card balance</div></div>';
    if(s.cardUtilization != null){
      const c = s.cardUtilization > 70 ? "var(--down)" : s.cardUtilization > 30 ? "var(--warn)" : "var(--up)";
      html += '<div><div class="n" style="color:' + c + '">' + s.cardUtilization + '%</div><div class="nl">Utilization</div></div>';
    }
    html += '</div>';
    cashDetail.innerHTML = html;
    cashHint.textContent = known.length > 1 ? "click" : "";
  }

  /* ---- 2 · Outstanding AR ---- */
  arBig.textContent = usd(s.arTotal);
  if(s.arOverdue > 0){
    arDelta.className = "delta down";
    arDelta.innerHTML = '<span class="dot" style="background:var(--down)"></span>' + usd(s.arOverdue) + ' overdue';
  } else {
    arDelta.className = "delta flat";
    arDelta.textContent = "None overdue";
  }
  arClients.textContent = (D.arByClient || []).length;
  const oldest = Math.max(0, ...(D.ar || []).map(i => i.daysOverdue || 0));
  arOldest.textContent = oldest ? oldest + "d" : "—";

  /* ---- 3 · Monthly burn ---- */
  burnBig.textContent = usd(s.monthlyBurn);
  burnYear.textContent = usdk(s.monthlyBurn * 12);
  burnItems.textContent = (D.burn.categories || []).reduce((a,c) => a + c.items.length, 0);

  /* ---- 4 · Net ---- */
  netBig.textContent = (s.monthlyNet >= 0 ? "+" : "−") + usd(Math.abs(s.monthlyNet));
  netBig.style.color = s.monthlyNet >= 0 ? "var(--up)" : "var(--down)";
  netSub.textContent = usd(s.mrr) + " in · " + usd(s.monthlyBurn) + " out";
  netClients.textContent = (D.retainers || []).length;
  const cov = s.monthlyBurn ? Math.round(s.mrr / s.monthlyBurn * 100) : null;
  netCover.textContent = cov == null ? "—" : cov + "%";
  netCover.style.color = cov != null && cov >= 100 ? "var(--up)" : "var(--warn)";
}

function cycle(){ const known=(D.accounts||[]).filter(a=>a.balance!=null); if(known.length>1){ai=(ai+1)%known.length;render();} }
document.getElementById("pCash").addEventListener("click", cycle);

function load(){
  // Try the published feed first, fall back to a sibling finance-data.js
  // (lets the same file preview locally before it's pushed to Pages).
  const tryLoad = (srcs, i) => {
    if(i >= srcs.length){ document.getElementById("cashSub").textContent = "data feed offline"; return; }
    const sc = document.createElement("script");
    sc.src = srcs[i] + "?t=" + Date.now();
    sc.onload = () => { sc.remove(); if(window.FINDATA){ D = window.FINDATA; render(); } else { tryLoad(srcs, i+1); } };
    sc.onerror = () => { sc.remove(); tryLoad(srcs, i+1); };
    document.head.appendChild(sc);
  };
  tryLoad([JSSRC, "finance-data.js"], 0);
}
load(); setInterval(load, 300000); window.addEventListener("resize", render);
</script></body></html>
