<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Monthly Burn</title>
<style>
:root{--bg:#fff;--line:#ececec;--text:#111;--muted:#8a8a8a;--accent:#e8622c;--soft:#f2f2f2;
 --up:#0ca30c;--down:#d03b3b;--warn:#fab219;
 --s1:#eb6834;--s2:#2a78d6;--s3:#1baf7a;--s4:#4a3aa7}
@media (prefers-color-scheme:dark){:root{--bg:#171717;--line:#2a2a2a;--text:#f4f4f4;--soft:#262626;
 --s1:#e8622c;--s2:#3987e5;--s3:#199e70;--s4:#9085e9}}
*{margin:0;box-sizing:border-box}html,body{width:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;color:var(--text);padding:clamp(14px,1.7vw,22px)}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap}
.k{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.big{font-size:clamp(28px,3.4vw,44px);font-weight:800;letter-spacing:-1.6px;line-height:1;margin-top:8px}
.sub{font-size:11.5px;color:var(--muted);margin-top:7px}
.stats{display:flex;gap:26px}
.n{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.nl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
.stack{display:flex;gap:2px;height:26px;margin-top:18px;border-radius:5px;overflow:hidden}
.seg{border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:11px}
.li{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.li b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:700}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:2px;margin-top:20px}
.cat{background:var(--soft);border-radius:9px;padding:13px 14px 12px}
.ch{display:flex;align-items:center;gap:7px}
.cn{font-size:11px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:7px;letter-spacing:-.5px}
.cp{font-size:9.5px;color:var(--muted);margin-top:2px}
.items{margin-top:11px;display:flex;flex-direction:column;gap:5px}
.it{display:flex;align-items:baseline;gap:8px;font-size:11px}
.iname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.ival{font-variant-numeric:tabular-nums;font-weight:700;flex:0 0 auto}
.more{font-size:10px;color:var(--muted);margin-top:6px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.note{margin-top:18px;font-size:11.5px;line-height:1.5;color:var(--muted);border-left:2px solid var(--accent);padding:2px 0 2px 11px}
.note b{color:var(--text)}
</style></head><body>

<div class="hd">
  <div>
    <div class="k">Monthly burn</div>
    <div class="big" id="total">—</div>
    <div class="sub" id="sub">loading…</div>
  </div>
  <div class="stats">
    <div><div class="n" id="annual">—</div><div class="nl">Per year</div></div>
    <div><div class="n" id="cover">—</div><div class="nl">Covered by retainers</div></div>
    <div><div class="n" id="runway">—</div><div class="nl">Runway</div></div>
  </div>
</div>

<div class="stack" id="stack"></div>
<div class="legend" id="legend"></div>
<div class="cats" id="cats"></div>
<div class="note" id="note"></div>

<script>
const JSSRC = "https://wcstudios.github.io/wcs-widgets/finance-data.js";
const usd = n => "$" + Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0});
const usdc = n => "$" + Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const SERIES = ["--s1","--s2","--s3","--s4"];
let expanded = {};

function render(D){
  const s = D.summary, cats = D.burn.categories || [], tot = D.burn.total || 1;
  total.textContent = usd(tot);
  sub.textContent = cats.reduce((a,c)=>a+c.items.length,0) + " fixed line items across " + cats.length + " categories";
  annual.textContent = usd(tot*12);
  const cov = Math.round(s.mrr / tot * 100);
  cover.textContent = cov + "%";
  cover.style.color = cov >= 100 ? "var(--up)" : "var(--warn)";
  runway.textContent = s.runwayMonths != null ? s.runwayMonths + " mo" : "—";

  stack.innerHTML = cats.map((c,i) =>
    '<div class="seg" style="flex:' + c.amount + ' 0 0;background:var(' + SERIES[i%SERIES.length] + ')" title="' + c.category + ': ' + usd(c.amount) + '"></div>').join("");
  legend.innerHTML = cats.map((c,i) =>
    '<span class="li"><span class="dot" style="background:var(' + SERIES[i%SERIES.length] + ')"></span>'
    + c.category + ' <b>' + usd(c.amount) + '</b> · ' + Math.round(c.amount/tot*100) + '%</span>').join("");

  cats.forEach((c,i) => { if(expanded[c.category] === undefined) expanded[c.category] = false; });
  cats2(D, cats, tot);
}

function cats2(D, cats, tot){
  document.getElementById("cats").innerHTML = cats.map((c,i) => {
    const open = expanded[c.category];
    const items = open ? c.items : c.items.slice(0,4);
    return '<div class="cat">'
      + '<div class="ch"><span class="dot" style="background:var(' + SERIES[i%SERIES.length] + ')"></span>'
      + '<span class="cn">' + c.category + '</span></div>'
      + '<div class="ct">' + usd(c.amount) + '</div>'
      + '<div class="cp">' + Math.round(c.amount/tot*100) + '% of burn · ' + c.items.length + ' items</div>'
      + '<div class="items">' + items.map(it =>
          '<div class="it"><span class="iname">' + it.name + (it.detail ? ' · ' + it.detail : '') + '</span>'
          + '<span class="ival">' + usdc(it.amount) + '</span></div>').join("") + '</div>'
      + (c.items.length > 4 ? '<div class="more" data-c="' + c.category + '">'
          + (open ? 'Show less' : 'Show all ' + c.items.length) + '</div>' : '')
      + '</div>';
  }).join("");

  document.querySelectorAll(".more").forEach(el => el.addEventListener("click", () => {
    expanded[el.dataset.c] = !expanded[el.dataset.c];
    cats2(D, cats, tot);
  }));

  const s = D.summary;
  const gap = s.mrr - tot;
  const biggest = cats.flatMap(c => c.items).reduce((a,b) => b.amount > a.amount ? b : a);
  document.getElementById("note").innerHTML =
    "<b>Retainers cover the nut " + (gap >= 0 ? "with " + usd(gap) + " to spare" : "short by " + usd(-gap)) + " each month.</b> "
    + "Largest single line is " + biggest.name + " at " + usdc(biggest.amount) + "/mo — "
    + Math.round(biggest.amount/tot*100) + "% of total burn. "
    + (s.cashOnHand == null ? "Runway needs a live cash balance — connect an account to fill it in." : "");
}

function load(){
  // Try the published feed first, fall back to a sibling finance-data.js
  // (lets the same file preview locally before it's pushed to Pages).
  const tryLoad = (srcs, i) => {
    if(i >= srcs.length){ document.getElementById("sub").textContent = "data feed offline"; return; }
    const sc = document.createElement("script");
    sc.src = srcs[i] + "?t=" + Date.now();
    sc.onload = () => { sc.remove(); if(window.FINDATA) render(window.FINDATA); else tryLoad(srcs, i+1); };
    sc.onerror = () => { sc.remove(); tryLoad(srcs, i+1); };
    document.head.appendChild(sc);
  };
  tryLoad([JSSRC, "finance-data.js"], 0);
}
load(); setInterval(load, 300000);
</script></body></html>
